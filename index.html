    App.saveDraft();
    const rem = this.list('notice.reminders'), prom = this.list('promise.items'), rl = this.rules(), word = this.payWord(), promT = this.t('promise.title') || '服務承諾';
    const firstView = d.cfOpen !== false;   /* 完整說明預設展開；客人自己收合後記住 */
    const CK = [
      ['agreeR', '預約前提醒', `我已閱讀並同意<a class="kw" href="#" data-cf-go="rem">預約前提醒</a>（共 ${rem.length} 項）`],
      ['agreeC', promT, `我已了解<a class="kw" href="#" data-cf-go="prom">${esc(promT)}</a>與服務內容`],
      ['agreeD', `${word}規範`, `我了解${word} ${U.money(this.full() ? p.price : p.deposit)} 用於確保時段，${this.payTerms(p).refund}<small>可改期 ${rl.rescheduleLimit} 次，需於服務日 ${rl.rescheduleMinDays} 天前在「我的預約」提出</small>`, 'warnck']
    ];
    const ok = () => CK.every(c => d[c[0]]);
    const missing = () => CK.filter(c => !d[c[0]]);
    const HINT = '全部勾選後才能前往付款';
    const next = () => ({ label: `下一步：${this.full() ? '付款' : '付款訂金'}`, short: '下一步', soft: true, disabled: !ok(), hint: HINT, go: () => submit(), blocked: () => nag() });
    /* whole row is a <label>: tapping the text toggles the checkbox; the real input stays in the tab order */
    const ck = (k, name, html, cls) => `<label class="ck ${d[k] ? 'on' : ''} ${cls || ''}" data-ck="${k}" data-ck-name="${esc(name)}"><input type="checkbox" class="ck-in" ${d[k] ? 'checked' : ''}><span class="box" aria-hidden="true">${ic('check')}</span><span class="ck-t">${html}</span></label>`;
    /* 手機版：步驟列只有進度條，所以在最上方放「你的選擇」卡片，點「更改」回到方案或時段 */
    const pickSum = `<div class="pick-sum card"><b class="ps-h">你的選擇</b>
        ${this.entrySingle() ? `<div class="ps-row">${pl(p.style, 'pp', { glow: .6, ring: false, lite: 1 })}<span><small>方案</small><b>${esc(p.name)}</b></span><span class="chip sm">固定</span></div>` : `<a class="ps-row" href="#/book/plan" data-goback="plan">${pl(p.style, 'pp', { glow: .6, ring: false, lite: 1 })}<span><small>方案</small><b>${esc(p.name)}</b></span><span class="tlink sm">更改${ic('right')}</span></a>`}
        <a class="ps-row" href="#/book/slot" data-goback="slot"><span class="ps-d num">${+d.date.slice(8)}</span><span><small>日期・時段</small><b class="num">${U.dateLabel(d.date, true).replace(/^\d{4}\./, '')} ${d.time} – ${this.endOf(d.time, p)}</b></span><span class="tlink sm">更改${ic('right')}</span></a>${d.entry && d.entry.tarot ? `<a class="ps-row" href="#/book/tarot"><span class="ps-d">${ic('sparkle')}</span><span><small>占卜結果</small><b>${esc(d.tarotLine || (d.tarotText ? '已貼上占卜結果' : '—'))}</b></span><span class="tlink sm">更改${ic('right')}</span></a>` : ''}</div>`;
    const main = `
      ${pickSum}
      <div class="who card">${this.avatar(u)}<div><b>${esc(u.displayName || '')}</b><small>已使用 LINE 登入・預約通知會傳到這個帳號</small></div><button class="tlink sm" data-switch>切換帳號</button></div>
      <section class="card blk"><h2>預約資料</h2><p class="blk-s">僅用於本次服務聯繫。</p>
        <div class="f2"><label class="fld"><span class="lbl"><span>姓名<span class="req">*</span></span></span><input class="inp" name="name" autocomplete="name" maxlength="30" value="${esc(d.name)}"><span class="ferr" data-e="name"></span></label>
        <label class="fld"><span class="lbl"><span>手機<span class="req">*</span></span><small>09 開頭 10 碼</small></span><input class="inp num" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="12" placeholder="09xxxxxxxx" value="${esc(d.phone)}"><span class="ferr" data-e="phone"></span></label></div>
        <label class="fld"><span class="lbl"><span>想處理的主題<span class="req">*</span></span><small class="num"><span data-cnt="topic">${String(d.topic).length}</span> / ${max}</small></span><textarea class="inp" name="topic" maxlength="${max}" placeholder="簡單描述這次最想處理的困擾，以一個主題為原則">${esc(d.topic)}</textarea><span class="ferr" data-e="topic"></span></label>
        <label class="fld"><span class="lbl"><span>希望處理後能獲得的改變<span class="req">*</span></span><small class="num"><span data-cnt="expect">${String(d.expect).length}</span> / ${emax}</small></span><textarea class="inp" name="expect" maxlength="${emax}" rows="3" placeholder="例如：不再因為錢焦慮、能和媽媽好好說話">${esc(d.expect)}</textarea><span class="ferr" data-e="expect"></span></label>
      </section>
      <section class="card blk agree-blk" data-agree><h2>確認與同意</h2><p class="blk-s">勾選前，請先閱讀下方完整說明。</p>
        <details class="cf-more first" data-cf-more ${firstView ? 'open' : ''}><summary>${ic('doc')}<span>完整說明・請先閱讀</span><small>預約前提醒 ${rem.length} 項・${esc(promT)} ${prom.length} 項</small>${ic('down', 'cf-chev')}</summary>
          <div class="cf-body"><h3 data-cf-sec="rem">預約前提醒</h3><ol class="rem full cf">${this.reminders(true)}</ol>
          <h3 data-cf-sec="prom">${esc(promT)}</h3><ul class="mini-pr">${prom.map(x => `<li><b>${esc(x.title)}</b><p>${esc(x.body)}</p></li>`).join('')}</ul></div>
        </details>
        <div class="cks" role="group" aria-label="確認與同意">${CK.map(c => ck(c[0], c[1], c[2], c[3])).join('')}</div>
      </section>`;
    let rt;
    /* tapping the not-yet-ready CTA: name the unchecked items, scroll to and highlight the first one */
    const nag = () => {
      const miss = missing(); if (!miss.length) return;
      toast(`尚未勾選：${miss.map(c => c[1]).join('、')}`, 'err');
      rt.querySelectorAll('[data-ck]').forEach(x => x.classList.toggle('need', !d[x.dataset.ck]));
      const first = rt.querySelector(`[data-ck="${miss[0][0]}"]`);
      first.scrollIntoView({ block: 'center', behavior: Sky.reduced() ? 'auto' : 'smooth' });
      setTimeout(() => { try { first.querySelector('.ck-in').focus({ preventScroll: true }); } catch (e) { } }, Sky.reduced() ? 0 : 350);
    };
    const submit = () => {
      if (!ok()) return nag();
      const errs = {}; const v = k => String(d[k] || '').trim();
      if (!v('name')) errs.name = '請填寫姓名';
      if (!/^09\d{8}$/.test(v('phone').replace(/[-\s]/g, ''))) errs.phone = '手機格式為 09 開頭 10 碼';
      if (!v('topic')) errs.topic = '請填寫想處理的主題';
      if (!v('expect')) errs.expect = '請填寫希望處理後能獲得的改變';
      ['name', 'phone', 'topic', 'expect'].forEach(k => { const i = rt.querySelector(`[name="${k}"]`); i.classList.toggle('err', !!errs[k]); i.setAttribute('aria-invalid', !!errs[k]); rt.querySelector(`[data-e="${k}"]`).textContent = errs[k] || ''; });
      const first = Object.keys(errs)[0];
      if (first) { const i = rt.querySelector(`[name="${first}"]`); i.focus(); i.scrollIntoView({ block: 'center', behavior: Sky.reduced() ? 'auto' : 'smooth' }); toast(errs[first], 'err'); return; }
      api.call('updateProfile', { name: v('name'), phone: v('phone').replace(/[-\s]/g, '') }).then(x => x && x.user && Session.setUser(x.user)).catch(() => { });
      App.go('#/book/pay');
    };
    this.bookPage(root, {
      step: 'confirm', title: d.entry && d.entry.tarot ? '確認資料' : '確認資料與須知', main, next: next(), back: '#/book/slot',
      bind: r => {
        rt = r;
        r.querySelectorAll('.inp').forEach(i => i.addEventListener('input', () => { d[i.name] = i.value; App.saveDraft(); if (i.classList.contains('err')) { i.classList.remove('err'); const e = r.querySelector(`[data-e="${i.name}"]`); if (e) e.textContent = ''; } const c = r.querySelector(`[data-cnt="${i.name}"]`); if (c) c.textContent = i.value.length; }));
        /* 勾選項裡的「預約前提醒」「服務承諾」：打開完整說明並捲到對應段落 */
        r.querySelectorAll('[data-cf-go]').forEach(a => a.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          const more = r.querySelector('[data-cf-more]'); more.open = true;
          const h = r.querySelector(`[data-cf-sec="${a.dataset.cfGo}"]`); if (h) h.scrollIntoView({ block: 'start', behavior: Sky.reduced() ? 'auto' : 'smooth' });
        }));
        r.querySelectorAll('[data-ck]').forEach(row => {
          const inp = row.querySelector('.ck-in');
          inp.addEventListener('change', () => {
            const k = row.dataset.ck; d[k] = inp.checked; App.saveDraft(); row.classList.toggle('on', d[k]); row.classList.remove('need');
            if (ok()) Tracker.push('AGREE_ALL');
            this.refreshSum(r, next());
          });
        });
        const more = r.querySelector('[data-cf-more]'); if (more) more.addEventListener('toggle', () => { if (more.open) Tracker.push('VIEW_TERMS'); if (d.cfOpen !== more.open) { d.cfOpen = more.open; App.saveDraft(); } });
        r.querySelector('[data-switch]').addEventListener('click', () => { Session.clear('front'); App.go('#/book/login'); });
      }
    });
  },

  /* ---------- 5 支付訂金 ---------- */
  payBlock(m, sel, ref, single) {
    const meta = PAY_META[m.id] || { label: m.label || m.id, hint: '' };
    const icon = meta.icon ? ic(meta.icon) : `<span>${meta.mark || ''}</span>`;
    let xp = '';
    if (sel) {
      if (isTransfer(m)) {
        const bk = m.bank || {};
        xp = `<div class="xp"><div class="bacct"><div><span>${bankLine(bk)}</span><b class="num">${esc(bk.accountNo)}</b></div><button class="btn sm ghost" data-copy="${esc(String(bk.accountNo || '').replace(/-/g, ''))}">${ic('copy')}複製</button></div>
          <span class="lbl2">轉帳後回填帳號末五碼<small>（也可以送出後再回填）</small></span><div class="five num">${[0, 1, 2, 3, 4].map(i => `<input inputmode="numeric" maxlength="1" aria-label="末五碼第${i + 1}碼" data-five="${i}" value="${esc((ref || '')[i] || '')}">`).join('')}</div></div>`;
      } else xp = `<div class="xp"><p>送出預約後會開啟${esc(meta.label)}付款頁，完成付款後回到預約完成頁點選「我已完成付款」，Mia 對帳後即保留時段。</p></div>`;
    }
    /* only one method enabled: no radio, just the method and its details */
    if (single) return `<div class="pay on single"><div class="ptop static"><span class="pi ${meta.cls || ''}">${icon}</span><b>${esc(meta.label)}</b><small>${esc(meta.hint || '')}</small></div>${xp}</div>`;
    return `<div class="pay${sel ? ' on' : ''}"><button class="ptop" data-pm="${esc(m.id)}" role="radio" aria-checked="${!!sel}"><span class="rd" aria-hidden="true"></span><span class="pi ${meta.cls || ''}">${icon}</span><b>${esc(meta.label)}</b><small>${esc(meta.hint || '')}</small></button>${xp}</div>`;
  },
  book_pay(root) {
    const d = App.draft, p = this.draftPlan();
    if (!p) return App.go('#/book/plan'); if (!d.date || !d.time) return App.go('#/book/slot');
    if (!d.agreeR || !d.agreeC || !d.agreeD || !d.name || !d.phone || !d.topic || !String(d.expect || '').trim()) return App.go('#/book/confirm');
    App.step = 6; this.view('pay', 'VIEW_PAY');
    const methods = this.cfg.payMethods || []; if (!methods.find(m => m.id === d.method)) d.method = methods[0] ? methods[0].id : '';
    const r = this.rules(), full = this.full(), h = this.dueHours(), amount = full ? p.price : p.deposit;
    const valid = () => d.method && (!isTransfer(methods.find(m => m.id === d.method)) || !d.ref || /^\d{5}$/.test(d.ref));
    const next = () => ({ label: `送出預約・${full ? '支付費用' : '支付訂金'} ${U.money(amount)}`, short: '送出預約', disabled: !valid() || !methods.length, go: b => submit(b) });
    const single = methods.length === 1;
    const payHead = single ? `<h2 class="pay-h">付款方式：${esc((PAY_META[methods[0].id] || {}).label || methods[0].label || methods[0].id)}</h2>` : `<h2 class="pay-h">選擇付款方式</h2>`;
    const rules = full
      ? `<p>${ic('warn')}<span>費用 <b class="num">${U.money(p.price)}</b> 一次付清，用於確保時段；取消或未出席，費用不退。</span></p><p>${ic('clock')}<span>請於預約後 ${h} 小時內完成付款，逾期未付款系統將自動釋出時段。</span></p>`
      : `<p>${ic('warn')}<span>訂金 <b class="num">${U.money(p.deposit)}</b> 用於確保時段；取消或未出席，訂金不退。</span></p><p>${ic('clock')}<span>訂金請於預約後 ${h} 小時內完成，逾期未付款系統將自動釋出時段。</span></p><p>${ic('cal')}<span>尾款 <b class="num">${U.money(p.balance != null ? p.balance : p.price - p.deposit)}</b> 於服務日前 ${r.balanceDueDays} 天（<span class="num">${U.dot(U.addDays(d.date, -r.balanceDueDays))}</span>）付清。</span></p>`;
    const main = `
      ${methods.length ? `${payHead}${single ? `<div class="pays" data-pays>${this.payBlock(methods[0], true, d.ref, true)}</div>` : `<div class="pays" role="radiogroup" aria-label="付款方式" data-pays>${methods.map(m => this.payBlock(m, m.id === d.method, d.ref)).join('')}</div>`}` : `<div class="note bad">${ic('warn')}<span>目前尚未開放線上付款，請透過官方 LINE 與 Mia 聯繫預約。</span></div>`}
      <div class="pay-rules card">${rules}</div>`;
    let busy = false;
    const submit = async b => {
      if (busy) return; busy = true;
      document.querySelectorAll('[data-next]').forEach(x => { x.disabled = true; x.dataset.l = x.innerHTML; x.textContent = '送出中…'; });
      try {
        const res = await api.call('createBooking', { planId: d.planId, date: d.date, time: d.time, name: d.name.trim(), phone: d.phone.replace(/[-\s]/g, ''), topic: d.topic.trim(), expectChange: String(d.expect || '').trim(), agreedReminders: true, agreedCommitments: true, payment: { method: d.method, ref: d.method === 'bank' ? (d.ref || '') : '' }, sessionId: Tracker.sessionId(), quizResultId: d.quizResultId || undefined, source: SRC.cur(), firstSource: SRC.first(), entryCode: d.entry ? d.entry.code : '', tarotReadingId: d.entry && d.entry.tarot ? (d.tarotReadingId || '') : '', tarotNote: d.entry && d.entry.note ? String(d.tarotNote || '').trim() : '', tarotText: d.entry && d.entry.tarot && !d.tarotReadingId ? String(d.tarotText || '').trim() : '' });
        const id = res.booking.bookingId;
        Tracker.push('SUBMIT_BOOKING', { bookingId: id, planId: d.planId, date: d.date, time: d.time });
        const keep = { skipPlan: d.skipPlan }; App.clearDraft(); Object.assign(App.draft, keep); App.saveDraft(); this._slotO = null;
        App.go('#/book/done/' + id);
      } catch (er) {
        busy = false;
        Tracker.push('ERROR', { step: 6, meta: { code: er.code } }); errToast(er);
        if (er.code === 'SLOT_TAKEN' || er.code === 'SLOT_INVALID') { d.time = ''; App.saveDraft(); this._slotO = null; return App.go('#/book/slot'); }
        if (er.code === 'CUSTOMER_BLOCKED') { const u = Session.user(); if (u) { u.blocked = true; Session.setUser(u); } return App.go('#/book/login'); }
        if (er.code === 'PLAN_DISABLED') { App.cfg = null; return App.go('#/book/plan'); }
        document.querySelectorAll('[data-next]').forEach(x => { x.disabled = false; if (x.dataset.l) x.innerHTML = x.dataset.l; });
      }
    };
    this.bookPage(root, {
      step: 'pay', title: full ? '付款' : '支付訂金', lead: `${single ? '' : '選擇付款方式。'}完成付款並回填後，Mia 對帳確認即保留時段。`, main, next: next(), back: '#/book/confirm',
      bind: rt => {
        rt.querySelectorAll('[data-pm]').forEach(b => b.addEventListener('click', () => {
          if (d.method === b.dataset.pm) return;
          d.method = b.dataset.pm; App.saveDraft(); Tracker.push('SELECT_PAY_METHOD', { meta: { method: d.method } });
          this.book_pay(root);
        }));
        this.bindPay(rt, d, () => this.refreshSum(rt, next()));
      }
    });
  },
  bindPay(rt, d, onChange) {
    const fives = rt.querySelectorAll('[data-five]');
    const sync = () => { d.ref = Array.from(fives).map(i => i.value).join(''); App.saveDraft(); onChange(); };
    fives.forEach((inp, i) => {
      inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && fives[i + 1]) fives[i + 1].focus(); sync(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && fives[i - 1]) fives[i - 1].focus(); });
      inp.addEventListener('paste', e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 5); if (t.length > 1) { e.preventDefault(); t.split('').forEach((c, k) => { if (fives[k]) fives[k].value = c; }); sync(); } });
    });
  },

  /* ---------- 6 預約完成 ---------- */
  payUrl(method) { const m = (this.cfg.payMethods || []).find(x => x.id === method); return m && m.url; },
  paymentDialog(b, kind) {
    const methods = this.cfg.payMethods || []; let method = kind === 'deposit' ? (b.depositMethod || (methods[0] || {}).id) : (methods[0] || {}).id;
    if (!methods.find(x => x.id === method)) method = (methods[0] || {}).id;
    const amount = kind === 'deposit' ? b.deposit : b.balance, item = kind === 'deposit' ? payItemOf(b) : '尾款';
    const mLabel = x => (PAY_META[x.id] || {}).label || x.label || x.id;
    const body = () => {
      const m = methods.find(x => x.id === method);
      return `<p class="pd-amt">${item} <b class="num">${U.money(amount)}</b><span class="num">預約編號 ${esc(b.bookingId)}</span></p>
        ${methods.length > 1 ? `<p class="pd-h">選擇付款方式</p><div class="seg" role="tablist">${methods.map(x => `<button data-pm2="${esc(x.id)}" class="${x.id === method ? 'on' : ''}">${esc(mLabel(x))}</button>`).join('')}</div>` : m ? `<p class="pd-h">付款方式：${esc(mLabel(m))}</p>` : ''}
        ${m && isTransfer(m) ? `<div class="bacct sm"><div><span>${bankLine(m.bank)}</span><b class="num">${esc(m.bank.accountNo)}</b></div><button class="btn sm ghost" data-copy="${esc(String(m.bank.accountNo).replace(/-/g, ''))}">${ic('copy')}複製</button></div>
          <label class="fld"><span class="lbl"><span>帳號末五碼<span class="req">*</span></span></span><input class="inp num" id="pref" inputmode="numeric" maxlength="5" placeholder="例如 83214"></label>`
        : m ? `${m.url ? `<a class="btn ghost full" style="margin-bottom:12px" href="${esc(m.url)}" target="_blank" rel="noopener">${ic('link')}前往${esc(PAY_META[m.id].label)}付款</a>` : ''}<label class="fld"><span class="lbl"><span>交易序號</span><small>選填</small></span><input class="inp" id="pref" maxlength="30"></label>` : ''}`;
    };
    return modal({
      title: `回填${item}付款`, ok: '送出回填', cls: 'f-dlg', html: `<div data-pbody>${body()}</div>`,
      onOpen(sc) { sc.addEventListener('click', e => { const t = e.target.closest('[data-pm2]'); if (t) { method = t.dataset.pm2; sc.querySelector('[data-pbody]').innerHTML = body(); } }); },
      async onOk(sc) {
        const ref = ((sc.querySelector('#pref') || {}).value || '').trim();
        if (isTransfer(methods.find(x => x.id === method)) && !/^\d{5}$/.test(ref)) { toast('請輸入帳號末五碼（5 位數字）', 'err'); return false; }
        const r = await api.call('submitPayment', { bookingId: b.bookingId, kind, method, ref });
        Tracker.push('SUBMIT_PAYMENT', { bookingId: b.bookingId }); toast('已送出，Mia 對帳後會由官方 LINE 通知你', 'ok'); return r || true;
      }
    });
  },
  async book_done(root, id) {
    if (!id) return App.go('#/my');
    const [{ booking: b }, me] = await Promise.all([api.call('getBooking', { bookingId: id }), api.call('authMe').catch(() => null)]);
    if (me && me.user) Session.setUser(me.user);
    App.step = 7; this.view('done' + id, 'VIEW_DONE', { bookingId: id });
    const u = Session.user() || {}, r = this.rules(), line = App.isLine();
    const unpaid = b.status === 'UNPAID', url = this.payUrl(b.depositMethod);
    const plan = this.plan(b.planId) || {};
    const st = `<span class="st ${esc(b.statusClass)}" data-status>${esc(b.statusLabel)}</span>`;
    const code = `<div class="code"><span>預約編號</span><b class="num" data-code>${esc(b.bookingId)}</b><button class="cp" data-copy="${esc(b.bookingId)}" aria-label="複製預約編號">${ic('copy')}</button></div>`;
    const full = isFullPay(b), word = payItemOf(b);
    const payBox = unpaid ? `<div class="paybox card"><div><b>完成${word}付款</b><p>${url ? `前往${esc(PAY_META[b.depositMethod].label)}付款頁支付 ${U.money(b.deposit)}，完成後點選「我已完成付款」。` : `請支付 ${U.money(b.deposit)}，完成後點選「我已完成付款」。`}${word}需於 <span class="num">${U.tsLabel(b.depositDueAt)}</span> 前完成。</p></div><div class="pb-b">${url ? `<a class="btn sm pri" href="${esc(url)}" target="_blank" rel="noopener">${ic('link')}前往付款</a>` : ''}<button class="btn sm ghost" data-paid>我已完成付款</button></div></div>` : '';
    const detail = `<dl class="kv">
        <div><dt>方案</dt><dd>${esc(b.planName)}</dd></div><div><dt>日期</dt><dd class="num">${U.dateLabel(b.date, true)}</dd></div><div><dt>時間</dt><dd class="num">${b.startTime} – ${b.endTime}</dd></div>
        <div><dt>${full ? '費用' : '訂金'}</dt><dd class="num">${U.money(b.deposit)}・${esc((PAY_META[b.depositMethod] || {}).label || '—')}${full ? '・一次付清' : ''}</dd></div>${b.depositRef ? `<div><dt>末五碼</dt><dd class="num">${esc(b.depositRef)}</dd></div>` : ''}
        ${full ? '' : `<div><dt>尾款</dt><dd class="num">${U.money(b.balance)}・<span class="dl">${U.dot(b.balanceDueDate)} 前</span></dd></div>`}</dl>`;
    if (line) {
      const back = this.lineReturnUrl();
      const html = this.shell(`<div class="wrap bkpg line-done">${this.stepsHTML('done')}
        <div class="ld card">${pl(plan.style || 'rel', 'ld-pl', { glow: .9 })}<span class="ok-dot">${ic('check')}</span><h1>預約已送出</h1>${code}<p class="sent">${ic('check')}${u.isFriend ? '預約通知已傳送到 LINE' : '加入官方 LINE 好友即可收到通知'}</p>${st}${detail}</div>

/* ===================== FRONT 尋找你的星球 quiz (F) — SPEC_v2 §4.1 quiz ===================== */
Object.assign(Front, {
  qState() { try { return JSON.parse(U.ss.get('mia.quiz.state') || 'null') || { i: 0, a: {} }; } catch (e) { return { i: 0, a: {} }; } },
  qSave(s) { U.ss.set('mia.quiz.state', JSON.stringify(s)); },
  /* rocket path: nodes on a gentle wave; rocket sits between answered and current node */
  qPath(n, cur, done, from) {
    const ys = [44, 64, 48, 30, 46, 60, 38, 52];
    const pts = Array.from({ length: n }, (_, i) => [n === 1 ? 500 : 30 + i * (940 / (n - 1)), ys[i % ys.length]]);
    let d = `M${pts[0][0]} ${pts[0][1]}`;

/* 檔案：由後端取回後在瀏覽器裡開啟（Google 雲端的檔案不公開） */
const FileView = {
  cache: {},
  async blob(fileId) {
    if (this.cache[fileId]) return this.cache[fileId];
    const x = await api.call('getFile', { fileId });
    if (!x.data) throw new ApiError('NOT_FOUND', IS_DEMO ? '展示模式只保存 1.5 MB 以下的檔案內容，這個檔案無法預覽' : '無法開啟檔案');
    const bin = atob(x.data.replace(/^data:[^,]*,/, '')), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: x.file.type }));
    return (this.cache[fileId] = { url, file: x.file });
  },
  async open(fileId) { try { const b = await this.blob(fileId); window.open(b.url, '_blank', 'noopener'); } catch (e) { errToast(e); } },
  async download(fileId) { try { const b = await this.blob(fileId); const a = document.createElement('a'); a.href = b.url; a.download = b.file.name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { errToast(e); } },
  size(n) { n = +n || 0; return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; },
  kind(t) { return t === 'application/pdf' ? 'PDF' : t === 'image/png' ? 'PNG' : 'JPG'; }
};
/* 文字報告：支援 # 標題、- 清單、空行分段 */
function reportTextHTML(t) {
  const out = []; let list = null;
  String(t || '').split('\n').forEach(line => {
    const l = line.trim();
    if (/^[-・•]\s*/.test(l) && l.length > 1) { if (!list) { list = []; } list.push(`<li>${esc(l.replace(/^[-・•]\s*/, ''))}</li>`); return; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    if (!l) return;
    if (/^#{1,3}\s/.test(l)) out.push(`<h3>${esc(l.replace(/^#+\s*/, ''))}</h3>`); else out.push(`<p>${esc(l)}</p>`);
  });
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}

          <textarea class="inp" name="tarotText" maxlength="1000" rows="3" placeholder="例如：心態・錢幣 5、現況・聖杯 7、未來・星星">${esc(d.tarotText)}</textarea><span class="ferr" data-e="tarotText"></span>
          <p class="hint-line sm">還沒占卜？<a class="tlink sm" href="${esc(careBase())}#/ask">先到 Mia 陪伴抽牌${ic('right')}</a></p></section>`;
    const fld = (k, label, req, mx, ph, rows) => `<label class="fld"><span class="lbl"><span>${label}${req ? '<span class="req">*</span>' : ''}</span>${req ? `<small class="num"><span data-cnt="${k}">${String(d[k]).length}</span> / ${mx}</small>` : '<small>選填</small>'}</span><textarea class="inp" name="${k}" maxlength="${mx}" rows="${rows || 2}" placeholder="${esc(ph)}">${esc(d[k])}</textarea><span class="ferr" data-e="${k}"></span></label>`;
    const main = `${res}
      <section class="card blk"><h2>這次想處理的主題</h2><p class="blk-s">${isFull ? '寫下全能量檢測中看見、想和 Mia 一起處理的課題。' : '已先帶入你的占卜問題，可以再修改。'}</p>
        ${e.note ? fld('tarotNote', '占卜後的感受或補充', false, 300, '例如：看到星星那張牌時突然很想哭') : ''}
        ${fld('topic', '想處理的主題', true, max, isFull ? '全能量檢測中看見、想和 Mia 一起處理的課題' : '例如：為什麼我的錢總是留不住？')}
        ${fld('expect', '希望處理後能獲得的改變', true, emax, '例如：能安心存錢，不再用花錢填補不安。', 3)}</section>`;
    const go = () => {
      const errs = {}; const v = k => String(d[k] || '').trim();
      if (!rd && !(!authed && d.tarotReadingId) && v('tarotText').length < 2) errs.tarotText = '請選擇一筆占卜紀錄，或貼上占卜結果';
      if (!rd && !authed && d.tarotReadingId) { toast('請先用 LINE 登入，帶入占卜結果', 'err'); return; }
      if (!v('topic')) errs.topic = '請填寫想處理的主題';
      if (!v('expect')) errs.expect = '請填寫希望處理後能獲得的改變';
      Object.keys({ tarotText: 1, topic: 1, expect: 1 }).forEach(k => { const i = rt.querySelector(`[name="${k}"]`); if (!i) return; i.classList.toggle('err', !!errs[k]); const f = rt.querySelector(`[data-e="${k}"]`); if (f) f.textContent = errs[k] || ''; });
      const first = Object.keys(errs)[0]; if (first) { const i = rt.querySelector(`[name="${first}"]`); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } toast(errs[first], 'err'); return; }
      if (!rd) d.tarotLine = ''; App.saveDraft();
      App.go(single ? '#/book/slot' : '#/book/plan');
    };
    let rt;
    this.bookPage(root, {
      step: 'tarot', title: e.title || '延續你的占卜', lead: esc(e.sub || ''), main, back: careBase() + '#/records',
      next: { label: single ? '下一步：選擇時段' : '下一步：選擇方案', short: '下一步', go },
      bind: r => {
        rt = r;
        r.querySelectorAll('textarea.inp').forEach(i => i.addEventListener('input', () => { d[i.name] = i.value; App.saveDraft(); i.classList.remove('err'); const f = r.querySelector(`[data-e="${i.name}"]`); if (f) f.textContent = ''; const c = r.querySelector(`[data-cnt="${i.name}"]`); if (c) c.textContent = i.value.length; }));
        const lg = r.querySelector('[data-trlogin]'); if (lg) lg.addEventListener('click', () => login('front', '#/book/tarot'));
        const cl = r.querySelector('[data-trclear]'); if (cl) cl.addEventListener('click', () => { d.tarotReadingId = ''; d.tarotLine = ''; App.saveDraft(); this.book_tarot(root); });
        r.querySelectorAll('[data-trpick]').forEach(b => b.addEventListener('click', () => { d.tarotReadingId = b.dataset.trpick; d.topicFromTarot = false; d.topic = ''; App.saveDraft(); this.book_tarot(root); }));
      }
    });
  }
});

/* ---- front-faq.js ---- */
/* ===================== FRONT 常見問題 (F) — SPEC_v2 §4.1 faq ===================== */
Object.assign(Front, {
  async faqPage(root, cat) {
    this.view('faq', 'VIEW_FAQ');
    const l = this.cfg.line || {}, ig = this.t('footer.ig');
    if (!this.faqOn()) {
      const html = this.shell(`<section class="sec page-top"><div class="wrap narrow"><div class="empty card">${pl('check', '', { glow: .6, lite: 1 })}<h1 class="h-page sm">常見問題整理中</h1><p>${esc(this.t('faq.contact'))}</p></div></div></section>`, { cls: 'faq' });
      return this.mount(root, html);
    }
    const data = await api.call('getFaq');
    if (data.enabled === false) { this.site.content['faq.enabled'] = false; return this.faqPage(root, cat); }
    const cats = (data.categories || []).filter(c => (data.items || []).some(i => i.categoryId === c.categoryId));
    const items = this.fillFaq(data.items);
    const st = this._faq = { q: (this._faq && this._faq.q) || '', cat: cats.find(c => c.categoryId === cat) ? cat : '', more: {} };
    const open = {};   /* faqId → open, kept across redraws */
    const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
    const match = it => !st.q || norm(it.question + it.answer).indexOf(norm(st.q)) >= 0;
    /* highlight on the RAW text (case-insensitive), escaping every piece — never split escaped HTML (a query like "amp" would break &amp;) */
    const hl = (s, br) => {
      const raw = String(s == null ? '' : s), k = (st.q || '').trim(), out = x => br ? this.escBr(x) : esc(x);
      if (!k) return out(raw);
      const lo = raw.toLowerCase(), kl = k.toLowerCase(); let i = 0, j, h = '';
      while ((j = lo.indexOf(kl, i)) >= 0) { h += out(raw.slice(i, j)) + '<mark>' + out(raw.slice(j, j + k.length)) + '</mark>'; i = j + k.length; }
      return h + out(raw.slice(i));
    };
    const body = () => {
      const vis = items.filter(match);
      const groups = cats.filter(c => !st.cat || c.categoryId === st.cat).map(c => ({ c, list: vis.filter(i => i.categoryId === c.categoryId) })).filter(g => g.list.length);
      const tabs = `<div class="seg fq-tabs" role="tablist" aria-label="分類">${[{ categoryId: '', name: '全部' }].concat(cats).map(c => { const n = vis.filter(i => !c.categoryId || i.categoryId === c.categoryId).length; return `<button role="tab" data-fc="${esc(c.categoryId)}" class="${c.categoryId === st.cat ? 'on' : ''}" aria-selected="${c.categoryId === st.cat}">${esc(c.name)}<b>${n}</b></button>`; }).join('')}</div>`;
      const grp = g => {
        const lim = st.q || st.more[g.c.categoryId] ? g.list.length : 5, rest = g.list.length - lim;
        return `<section class="fq-g" data-fg="${esc(g.c.categoryId)}"><h2>${esc(g.c.name)}<small class="num">${g.list.length} 題</small></h2><div class="acc card">${g.list.slice(0, lim).map((f, i) => this.accItem(hl(f.question), hl(f.answer, true), i, !!(st.q && i === 0) || !!open[f.faqId], ` data-faq="${esc(f.faqId)}"`)).join('')}
          ${rest > 0 ? `<button class="fq-more" data-more="${esc(g.c.categoryId)}">看更多（${rest}）${ic('down')}</button>` : ''}</div></section>`;
      };
      return `${tabs}<p class="fq-count num" aria-live="polite">${st.q ? `找到 ${vis.length} 題` : `共 ${items.length} 題，依分類整理`}</p>${groups.length ? groups.map(grp).join('') : `<div class="empty card">${pl('check', '', { ring: false, glow: .5, lite: 1 })}找不到符合「${esc(st.q)}」的問題<br><button class="tlink sm" data-clear>清除搜尋</button></div>`}`;
    };
    const html = this.shell(`<section class="sec page-top faq-pg"><div class="wrap">
      ${this.pageHead(this.t('faq.title'), this.t('faq.sub'))}
      <label class="fq-s">${ic('search')}<span class="sr">搜尋問題</span><input type="search" class="fq-in" placeholder="搜尋問題，例如：改期、${this.full() ? '付款' : '訂金'}、Zoom" value="${esc(st.q)}" autocomplete="off" enterkeyhint="search"></label>
      <div class="fq-g2"><div class="fq-main" data-fqb>${body()}</div>
      <aside class="fq-side"><div class="card fq-contact">${ic('chat')}<h2>找不到答案？</h2><p>${esc(this.t('faq.contact'))}</p>${l.addFriendUrl ? `<a class="btn line-g full" href="${esc(l.addFriendUrl)}" target="_blank" rel="noopener"><span class="line-chip inv">LINE</span>透過官方 LINE 詢問</a>` : ''}${ig ? `<a class="btn ghost full" href="${esc(ig)}" target="_blank" rel="noopener">${ic('ig')}Instagram 私訊</a>` : ''}</div></aside></div>
    </div></section>`, { cls: 'faq' });
    const bindBody = r => {
      const b = r.querySelector('[data-fqb]');
      b.querySelectorAll('[data-fc]').forEach(x => x.addEventListener('click', () => { st.cat = x.dataset.fc; try { history.replaceState(null, '', '#/faq' + (st.cat ? '?c=' + encodeURIComponent(st.cat) : '')); } catch (e) { } redraw(r); }));
      b.querySelectorAll('[data-more]').forEach(x => x.addEventListener('click', () => { st.more[x.dataset.more] = true; redraw(r); }));
      const cl = b.querySelector('[data-clear]'); if (cl) cl.addEventListener('click', () => { st.q = ''; r.querySelector('.fq-in').value = ''; redraw(r); });
    };
    const redraw = r => { const fb = r.querySelector('[data-fqb]'); fb.querySelectorAll('.acc-it[data-faq]').forEach(x => { open[x.dataset.faq] = x.classList.contains('open'); }); fb.innerHTML = body(); bindBody(r); paintPlanets(fb); };
    this.mount(root, html, r => {
      bindBody(r);
      let t; const inp = r.querySelector('.fq-in');
      inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { st.q = inp.value.trim(); redraw(r); }, 150); });
    });
  }
});
