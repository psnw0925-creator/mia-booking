/* ---- tokens.css ---- */
/* =====================================================================
   Mia v2 — shared design tokens + primitives  (owner: architect; builders do NOT edit,
   request changes through SPEC_v2 §12 change-log)
   Direction C「珍珠星環」: mid-light haze blue sky, frosted glass, iridescent rings,
   hairline orbits, serif headings (front). Admin = light theme on the same hue family.
   Scopes:  body.front  →  front site (glass on sky)      body.admin → back office (light cards)
   Load order in build.js: tokens.css → site.css (F) → admin.css (K).
   ===================================================================== */

/* ---------- 1. Global tokens (both scopes) ---------- */
:root {
  /* type */
  --font-serif: "Noto Serif TC", "Noto Serif CJK TC", "PingFang TC", serif;
  --font-sans: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-latin: "Cormorant Garamond", "TeX Gyre Pagella", Georgia, serif;   /* display Latin: logo, prices, dates in hero */
  --font-num: "Nunito", "Noto Sans TC", sans-serif;                        /* tabular numerals in UI/tables */
  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px; --fs-16: 16px; --fs-18: 18px;
  --fs-20: 20px; --fs-24: 24px; --fs-28: 28px; --fs-34: 34px; --fs-44: 44px;
  --lh-tight: 1.25; --lh-body: 1.7; --lh-loose: 1.9;
  --ls-wide: .08em; --ls-caps: .2em;

  /* ink (text) — same family in both scopes */
  --ink: #0F1E3C; --ink-2: #2A3F66; --ink-3: #3C5279; --ink-4: #6A7A9C;
  --deep: #1F3D78; --deep-2: #2C5598;          /* primary action blue */
  --baby: #A9CDF2; --baby-2: #D6ECFA;

  /* semantic */
  --ok: #2E9C95; --ok-bg: #DDF3F1; --ok-ink: #1F6F69;
  --warn: #D9A441; --warn-bg: #FFF0D6; --warn-ink: #94621C;
  --danger: #C25A44; --danger-bg: #F6DAD3; --danger-ink: #A0482F;
  --info-bg: #DCEBFA; --info-ink: #2F5F9A;
  --line-green: #06C755;

  /* plan palettes (planet mid/lo + tag bg/ink). style ids = Plans.style */
  --pl-money-hi: #FFF6EC; --pl-money-mid: #F7CDB2; --pl-money-lo: #B9849A; --pl-money-tag: #FDE9DE; --pl-money-ink: #9A5434;
  --pl-talent-hi: #F8F2FF; --pl-talent-mid: #C9B8F2; --pl-talent-lo: #6E63AE; --pl-talent-tag: #E3E9FC; --pl-talent-ink: #3E52A3;
  --pl-rel-hi: #F3FBFF; --pl-rel-mid: #A9D6FA; --pl-rel-lo: #4A78B4; --pl-rel-tag: #D6ECFA; --pl-rel-ink: #2F5F9A;
  --pl-love-hi: #FFF3F8; --pl-love-mid: #F2BCD6; --pl-love-lo: #8E6AA6; --pl-love-tag: #ECE4FA; --pl-love-ink: #5B4BA6;
  --pl-check-hi: #F0FFFC; --pl-check-mid: #A6E3DE; --pl-check-lo: #3F8A9E; --pl-check-tag: #DCEFF2; --pl-check-ink: #2E6475;
  --pl-custom1-hi: #F4F7FF; --pl-custom1-mid: #AFC0F2; --pl-custom1-lo: #4B5BA6; --pl-custom1-tag: #E6EAFB; --pl-custom1-ink: #3E4C9A;
  --pl-custom2-hi: #FFF8F0; --pl-custom2-mid: #F5D9A8; --pl-custom2-lo: #A07A62; --pl-custom2-tag: #FBEEDC; --pl-custom2-ink: #8A5A2C;
  --pl-custom3-hi: #F2FFF8; --pl-custom3-mid: #B4E6CC; --pl-custom3-lo: #4A8A86; --pl-custom3-tag: #DEF4EA; --pl-custom3-ink: #2F6E5C;
  --pl-custom4-hi: #EFF9FF; --pl-custom4-mid: #8FCBEF; --pl-custom4-lo: #2F6A9E; --pl-custom4-tag: #DBEEFC; --pl-custom4-ink: #27598A;
  --pl-custom5-hi: #FFF4F2; --pl-custom5-mid: #F4BFB4; --pl-custom5-lo: #9A6077; --pl-custom5-tag: #FBE4E0; --pl-custom5-ink: #8A4A5C;
  --pl-custom6-hi: #FBF7FF; --pl-custom6-mid: #D9C9F5; --pl-custom6-lo: #6C5C9E; --pl-custom6-tag: #EDE6FA; --pl-custom6-ink: #5A4A8C;
  --pl-custom7-hi: #FFFFFF; --pl-custom7-mid: #C8D8EA; --pl-custom7-lo: #53698E; --pl-custom7-tag: #E6EDF6; --pl-custom7-ink: #46587F;
  /* hero pearl planet */
  --pl-pearl-hi: #FFFFFF; --pl-pearl-mid: #C4DAF3; --pl-pearl-lo: #56709F;

  /* radii / motion / z */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;
  --ease: cubic-bezier(.2,.7,.2,1); --t-fast: .15s; --t-med: .25s; --t-slow: .45s;
  --z-sky: -1; --z-header: 40; --z-tabbar: 50; --z-sheet: 60; --z-modal: 70; --z-toast: 90;
  --gutter: 16px;                 /* phone side gutter */
  --wrap: 1200px;                 /* desktop content width */
  --tabbar-h: 66px; --tabbar-gap: 12px;
  --hdr-h: 76px; --hdr-h-m: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

/* ---------- 3. ADMIN scope (light) ---------- */
body.admin {
  --bg: #F2F7FD;
  --bg-grad: radial-gradient(900px 500px at 85% -10%, rgba(198,226,253,.9), transparent 70%),
             radial-gradient(700px 500px at 30% 110%, rgba(232,222,255,.55), transparent 70%),
             linear-gradient(180deg, #EDF4FC, #F6F9FE);
  --card: #FFFFFF; --card-bg: rgba(255,255,255,.88);
  --line: #E2EAF5; --line-2: #D3DFEF;
  --sel: #D6E9FD; --focus: #3D6FC0;
  --ink: #14244A; --ink-2: #46587F; --ink-3: #6A7A9C;
  --side-w: 244px; --side-rail: 64px;
  --nav-on: linear-gradient(180deg, #5F92DB, #2C559A);
  --btn-radius: 10px; --btn-ls: .06em;
  --pri-bg: linear-gradient(180deg, #5F92DB, #2C559A);
  --pri-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 14px -6px rgba(44,85,152,.6);
  --card-radius: 18px;
  --card-shadow: 0 0 0 1px rgba(205,221,242,.6), 0 18px 40px -26px rgba(30,60,120,.35);
  --th-bg: #F6F9FD; --row-alt: rgba(246,249,253,.6); --row-sel: #EAF4FF;
  --load-bar: linear-gradient(90deg, #8FBBEA, #2C5598);
  background: var(--bg-grad) fixed, var(--bg); color: var(--ink);
}

/* ---------- 4. Reset + primitives (both scopes) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--font-sans); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, h4, p, ul, ol, dl, dd, blockquote, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
::selection { background: var(--sel); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0; }
.lat { font-family: var(--font-latin); font-weight: 500; }
.serif { font-family: var(--font-serif); font-weight: 600; letter-spacing: var(--ls-wide); }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: min(var(--wrap), 100% - var(--gutter) * 2); margin-inline: auto; }

/* planet host: <span class="pl" data-planet="rel"></span> painted by window.Planets.paint() */
[data-planet] { display: block; aspect-ratio: 1; }
[data-planet] svg { width: calc(100% * var(--k, 1)); max-width: none; height: auto; margin-left: calc((100% - 100% * var(--k, 1)) / 2); }

/* buttons: .btn + .pri | .ghost | .soft | .danger ; sizes .sm .lg ; .full */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: var(--btn-radius); font-size: var(--fs-15); font-weight: 600; letter-spacing: var(--btn-ls); white-space: nowrap; position: relative; isolation: isolate; transition: scale var(--t-fast) ease-out, box-shadow var(--t-med) ease-out, background-color var(--t-fast); }
.btn:not(:disabled):active { scale: .96; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 38px; padding: 0 16px; font-size: var(--fs-13); }
.btn.lg { height: 56px; padding: 0 30px; font-size: var(--fs-16); }
.btn.full { width: 100%; }
.btn .i { width: 18px; height: 18px; }

.p-talent { --hi: var(--pl-talent-hi); --mid: var(--pl-talent-mid); --lo: var(--pl-talent-lo); --tag: var(--pl-talent-tag); --tag-ink: var(--pl-talent-ink); }
.p-rel { --hi: var(--pl-rel-hi); --mid: var(--pl-rel-mid); --lo: var(--pl-rel-lo); --tag: var(--pl-rel-tag); --tag-ink: var(--pl-rel-ink); }
.p-love { --hi: var(--pl-love-hi); --mid: var(--pl-love-mid); --lo: var(--pl-love-lo); --tag: var(--pl-love-tag); --tag-ink: var(--pl-love-ink); }
.p-check { --hi: var(--pl-check-hi); --mid: var(--pl-check-mid); --lo: var(--pl-check-lo); --tag: var(--pl-check-tag); --tag-ink: var(--pl-check-ink); }
.p-custom1 { --hi: var(--pl-custom1-hi); --mid: var(--pl-custom1-mid); --lo: var(--pl-custom1-lo); --tag: var(--pl-custom1-tag); --tag-ink: var(--pl-custom1-ink); }
.p-custom2 { --hi: var(--pl-custom2-hi); --mid: var(--pl-custom2-mid); --lo: var(--pl-custom2-lo); --tag: var(--pl-custom2-tag); --tag-ink: var(--pl-custom2-ink); }
.p-custom3 { --hi: var(--pl-custom3-hi); --mid: var(--pl-custom3-mid); --lo: var(--pl-custom3-lo); --tag: var(--pl-custom3-tag); --tag-ink: var(--pl-custom3-ink); }
.p-custom4 { --hi: var(--pl-custom4-hi); --mid: var(--pl-custom4-mid); --lo: var(--pl-custom4-lo); --tag: var(--pl-custom4-tag); --tag-ink: var(--pl-custom4-ink); }
.p-custom5 { --hi: var(--pl-custom5-hi); --mid: var(--pl-custom5-mid); --lo: var(--pl-custom5-lo); --tag: var(--pl-custom5-tag); --tag-ink: var(--pl-custom5-ink); }
.p-custom6 { --hi: var(--pl-custom6-hi); --mid: var(--pl-custom6-mid); --lo: var(--pl-custom6-lo); --tag: var(--pl-custom6-tag); --tag-ink: var(--pl-custom6-ink); }
.p-custom7 { --hi: var(--pl-custom7-hi); --mid: var(--pl-custom7-mid); --lo: var(--pl-custom7-lo); --tag: var(--pl-custom7-tag); --tag-ink: var(--pl-custom7-ink); }

/* form fields (shared shape; scope colours) */
.fld { display: grid; gap: 6px; margin-bottom: 14px; }
.fld .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-13); font-weight: 600; letter-spacing: .04em; }

/* segmented tabs: <div class="seg"><button class="on">A<b>12</b></button>…</div> */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--seg-bg, rgba(255,255,255,.35)); border: 1px solid var(--seg-border, rgba(255,255,255,.7)); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 36px; padding: 0 16px; border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: 600; letter-spacing: .04em; white-space: nowrap; color: var(--ink-3); display: inline-flex; gap: 6px; align-items: center; }

.utabs { display: flex; gap: 0; border-bottom: 1px solid var(--line-ink, var(--line)); overflow-x: auto; scrollbar-width: none; }
.utabs::-webkit-scrollbar { display: none; }

/* pager: <nav class="pager"><span class="rng">第 1–50 筆／共 1,284 筆</span><select class="ps">…</select><button class="pg" …>1</button>…</nav> */
.pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-13); color: var(--ink-3); padding: 12px 0; }
.pager .rng { margin-right: auto; }
.pager .pg { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 600; color: var(--ink-2); border: 1px solid transparent; }
.pager .pg.on { background: var(--ink); color: #fff; }

.pager .ps { height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line-2, var(--line)); background: var(--inp-bg, #fff); padding: 0 8px; }

/* load bar (admin month view / today capacity): <span class="load" style="--p:.6"><i></i></span> */
.load { display: block; height: 6px; border-radius: 3px; background: #E3EBF5; overflow: hidden; }
.load i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--load-bar, var(--deep)); border-radius: 3px; }
.mark { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 700; }
.mark.full { background: var(--deep-2); color: #fff; }
.mark.off { background: #EEF1F6; color: #6A7A9C; }
.mark.none { background: var(--warn-bg); color: var(--warn-ink); }

/* empty / skeleton */
.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); font-size: var(--fs-14); line-height: 1.8; }
.empty [data-planet] { width: 56px; margin: 0 auto 14px; opacity: .8; }
.skel { background: linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.55), rgba(255,255,255,.25)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: var(--r-md); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* toast / modal / sheet / scrim (implemented in app.js, styled here) */
#toasts { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; border-radius: var(--r-lg); padding: 11px 16px; box-shadow: 0 12px 30px -12px rgba(15,30,60,.6); display: flex; gap: 8px; align-items: center; animation: tin var(--t-med) ease-out; }
.toast.err { background: var(--danger-ink); }
.toast.ok { background: var(--ok-ink); }
.toast .i { width: 17px; height: 17px; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.scrim { position: fixed; inset: 0; background: rgba(15,30,60,.42); backdrop-filter: blur(4px); z-index: var(--z-modal); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fin .18s ease-out; }
@keyframes fin { from { opacity: 0; } to { opacity: 1; } }
.modal { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--modal-bg, #fff); color: var(--ink); border-radius: var(--r-xl); box-shadow: 0 40px 80px -30px rgba(15,30,60,.6); animation: pop var(--t-med) var(--ease); }
.modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
.modal .mh h3 { font-size: var(--fs-18); font-weight: 700; letter-spacing: .04em; }
.modal .mb { padding: 14px 20px; font-size: var(--fs-14); }
.modal .mf { display: flex; gap: 10px; justify-content: flex-end; padding: 0 20px 20px; }
.modal .x { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .scrim { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: 92vh; border-radius: var(--r-xl) var(--r-xl) 0 0; padding-bottom: var(--safe-b); animation: up var(--t-med) var(--ease); }
  .modal::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: rgba(20,40,80,.2); margin: 10px auto 0; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* demo badge (app.js) */
#demo-badge { position: fixed; left: 12px; bottom: calc(var(--tabbar-h) + var(--tabbar-gap) * 2 + var(--safe-b)); z-index: var(--z-sheet); height: 32px; padding: 0 12px 0 8px; border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 10px 24px -10px rgba(15,30,60,.7); }

#demo-menu { position: fixed; left: 12px; bottom: calc(var(--tabbar-h) + var(--tabbar-gap) * 2 + 40px + var(--safe-b)); z-index: var(--z-sheet); background: #fff; color: var(--ink); border-radius: var(--r-lg); box-shadow: 0 20px 50px -20px rgba(15,30,60,.5); padding: 6px; min-width: 200px; display: grid; }
#demo-menu a, #demo-menu button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); font-size: 13.5px; font-weight: 600; text-align: left; }
#demo-menu a:hover, #demo-menu button:hover { background: #EEF3FA; }

/* motion safety */

  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* ---------- sky layers ---------- */

.sky-host .neb { position: fixed; inset: -20%; pointer-events: none; }

.sky-host .neb .n1 { --c: var(--neb-1); width: 60vmax; height: 60vmax; left: 12%; top: 14%; opacity: .75; --t: 70s; --dx: 6%; --dy: -5%; }

.sky-host canvas.sky { position: fixed; left: 0; top: 0; }

const TZ = (window.MIA_CONFIG && MIA_CONFIG.TIMEZONE) || 'Asia/Taipei';
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const U = {
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  pad(n) { return String(n).padStart(2, '0'); },
  nowParts(d) {
    d = d || new Date();
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(d);
    const o = {}; p.forEach(x => o[x.type] = x.value);
    return { date: `${o.year}-${o.month}-${o.day}`, time: `${o.hour}:${o.minute}`, sec: o.second };
  },
  today() { return U.nowParts().date; },
  nowMin() { const t = U.nowParts().time; return U.toMin(t); },
  iso(d) { const p = U.nowParts(d); return `${p.date}T${p.time}:${p.sec}+08:00`; },
  toMin(t) { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; },
  fromMin(m) { return U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60); },
  addDays(ds, n) { const [y, m, d] = ds.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d + n)); return dt.toISOString().slice(0, 10); },
  dow(ds) { const [y, m, d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); },
  diffDays(a, b) { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5); },
  dateLabel(ds, withYear) { if (!ds) return ''; const [y, m, d] = ds.split('-'); return `${withYear ? y + '.' : ''}${m}.${d}（${WD[U.dow(ds)]}）`; },
  dot(ds) { return ds ? ds.replace(/-/g, '.') : ''; },
  tsLabel(iso) { if (!iso) return ''; return iso.slice(0, 10).replace(/-/g, '.') + ' ' + iso.slice(11, 16); },
  money(n) { return 'NT$' + Number(n || 0).toLocaleString('en-US'); },
  monthStart(ds) { return ds.slice(0, 8) + '01'; },
  monthEnd(ds) { const [y, m] = ds.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); },
  addMonths(ds, n) { const [y, m] = ds.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1 + n, 1)); return dt.toISOString().slice(0, 10); },
  weekStart(ds) { const w = U.dow(ds); return U.addDays(ds, w === 0 ? -6 : 1 - w); }, // Monday
  rid(n) { const a = new Uint8Array(n || 12); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 256 | 0); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); },
  clone(o) { return JSON.parse(JSON.stringify(o)); },
  ls: {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { } }
  },
  ss: {
    get(k) { try { return sessionStorage.getItem(k); } catch (e) { return U.ss._m[k] || null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { U.ss._m[k] = v; } },
    del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete U.ss._m[k]; } },
    _m: {}
  }
};

/* v2 shared helpers (SPEC_v2 §2.1) — scoreQuiz / pageOf are ported line-for-line to Code.gs */
/* groupSlots(slots, taken?) — slots = open start times; taken (optional) = held start times (DayAvail.taken).
   Each group: {key, label, slots (open, sorted), taken (held in this group), available (open count),
   range / rangeLabel: 'HH:mm–HH:mm' (first–last open slot), 'HH:mm' when one open slot, '' / '已額滿' when none}.
   A group is omitted only when it has neither open nor taken slots. */
function groupSlots(slots, taken) {
  return SLOT_GROUPS.map((g, i) => {
    const inG = t => t >= g[1] && t <= g[2];
    const list = (slots || []).filter(inG).slice().sort();
    const held = (taken || []).filter(inG).filter(t => list.indexOf(t) < 0).slice().sort();
    const range = list.length > 1 ? list[0] + '–' + list[list.length - 1] : list.length ? list[0] : '';
    return { key: SLOT_GROUP_KEYS[i], label: g[0], range, rangeLabel: list.length ? range : '已額滿', slots: list, taken: held, available: list.length };
  }).filter(g => g.slots.length || g.taken.length);
}
/* plans (optional 4th arg): Plan[] with sortOrder, or planId[] in order — defines plan order and the plan set ranked.
   Without it, plans are the planIds found in option scores, in order of first appearance. */
function scoreQuiz(questions, answers, tieBreakPlanId, plans) {
  const order = [];
  const addId = id => { if (id && order.indexOf(id) < 0) order.push(id); };
  if (plans && plans.length) {
    plans.slice().sort((a, b) => typeof a === 'string' ? 0 : (+a.sortOrder || 0) - (+b.sortOrder || 0)).forEach(p => addId(typeof p === 'string' ? p : p.planId));
  } else {
    (questions || []).forEach(q => (q.options || []).forEach(o => Object.keys(o.scores || {}).forEach(addId)));
  }
  const score = {}; order.forEach(id => score[id] = 0);
  (answers || []).forEach(a => {
    const q = (questions || []).find(x => x.questionId === a.questionId); if (!q) return;
    const o = (q.options || []).find(x => x.optionId === a.optionId); if (!o) return;
    Object.keys(o.scores || {}).forEach(id => { if (score.hasOwnProperty(id)) score[id] += (+o.scores[id] || 0); });
  });
  const ranking = order.map((id, i) => ({ planId: id, score: score[id], i })).sort((a, b) => b.score - a.score || a.i - b.i);
  let resultPlanId = ranking.length ? ranking[0].planId : '';
  if (ranking.length) {
    const top = ranking[0].score;
    const tied = ranking.filter(r => r.score === top);
    if (tied.length > 1 && tied.some(r => r.planId === tieBreakPlanId)) resultPlanId = tieBreakPlanId;
  }
  const ri = ranking.findIndex(r => r.planId === resultPlanId);
  if (ri > 0) ranking.unshift(ranking.splice(ri, 1)[0]);
  const out = ranking.map(r => ({ planId: r.planId, score: r.score }));
  const secondary = out.slice(1, 3).filter(r => r.score > 0).map(r => r.planId);
  return { ranking: out, resultPlanId, secondary };
}
function pageOf(list, page, pageSize) {
  list = list || [];
  pageSize = Math.max(1, Math.min(200, parseInt(pageSize, 10) || 50));
  const total = list.length, pages = Math.max(1, Math.ceil(total / pageSize));
  page = Math.max(1, Math.min(pages, parseInt(page, 10) || 1));
  return { items: list.slice((page - 1) * pageSize, page * pageSize), total, page, pageSize, pages };
}
function categoriesOf(plans) {
  const out = [];
  (plans || []).slice().sort((a, b) => (+a.sortOrder || 0) - (+b.sortOrder || 0)).forEach(p => { const c = String(p.category || '').trim(); if (c && out.indexOf(c) < 0) out.push(c); });
  return out;
}
function upcomingOf(b, today) { return !!b && b.date >= (today || U.today()) && HOLDING.includes(b.status); }

/* Payment mode (pay.mode): 'split' = 訂金 + 尾款, 'full' = one payment of the full price.
   A booking made in full mode is stored with deposit = price, balance = 0, so the mode of a booking is read from its amounts. */
function isFullPay(b) { return !!b && +b.price > 0 && +b.balance === 0 && +b.deposit >= +b.price; }
function payItemOf(b) { return isFullPay(b) ? '費用' : '訂金'; }
function statusOf(b) {
  if (isFullPay(b)) {
    if (b.status === 'UNPAID') return ['待付款', 's-unpaid'];
    if (b.status === 'CONFIRMED') return ['已付款', 's-full'];
  }
  if (b.status === 'CONFIRMED' && b.balanceStatus === 'PAID') return ['尾款已付', 's-full'];
  return STATUS[b.status] || [b.status, 's-unpaid'];
}

/* Slot engine — §5 */
function computeAvailability(db, from, to, opt) {
  opt = opt || {};
  const s = db.settings;
  const sess = +s['avail.sessionMinutes'], buf = +s['avail.bufferMinutes'], cap = +s['avail.dailyCap'];
  const today = opt.today || U.today();
  const firstDate = U.addDays(today, +s['avail.minNoticeDays']);
  const lastDate = U.addDays(today, +s['avail.bookingWindowDays']);
  const step = sess + buf;
  const dates = {};
  for (let d = from; d <= to; d = U.addDays(d, 1)) {
    if (!opt.ignoreWindow && (d < firstDate || d > lastDate)) { dates[d] = { state: 'off', slots: [], taken: [] }; continue; }
    const ranges = rangesFor(db, d);
    if (!ranges.length) { dates[d] = { state: 'closed', slots: [], taken: [] }; continue; }
    const cands = candidatesFrom(ranges, sess, step);
    const held = db.bookings.filter(b => b.date === d && HOLDING.includes(b.status) && b.bookingId !== opt.excludeId)
      .map(b => [U.toMin(b.startTime), U.toMin(b.startTime) + sess + buf]);
    const taken = db.bookings.filter(b => b.date === d && HOLDING.includes(b.status) && b.bookingId !== opt.excludeId && cands.includes(b.startTime)).map(b => b.startTime).sort();
    if (held.length >= cap) { dates[d] = { state: 'full', slots: [], taken, candidates: cands }; continue; }
    /* v3：課程場次的時間（前後加緩衝）自動從諮詢可預約時段扣除 */
    const blocks = (db.eventSessions || []).filter(x => x.state !== 'cancelled' && (db.events || []).some(e => e.eventId === x.eventId && e.state !== 'draft')).reduce((a, x) => a.concat((x.lessons || []).filter(l => l.date === d).map(l => [U.toMin(l.start) - buf, U.toMin(l.end) + buf])), []);
    const slots = cands.filter(t => { const a = U.toMin(t), z = a + sess + buf; return !held.some(([h1, h2]) => a < h2 && h1 < z) && !blocks.some(([b1, b2]) => a < b2 && b1 < z); });
    dates[d] = { state: slots.length ? 'open' : 'full', slots, taken, candidates: cands };
  }
  return { dates, firstDate, lastDate, sessionMinutes: sess };
}
function rangesFor(db, d) {
  let ov = null;
  db.overrides.forEach(o => { if (o.dateFrom <= d && d <= (o.dateTo || o.dateFrom)) ov = o; });
  if (ov) return ov.type === 'closed' ? [] : (ov.ranges || []);
  const w = db.availability.find(a => +a.weekday === U.dow(d));
  return w && w.enabled ? (w.ranges || []) : [];
}
function candidatesFrom(ranges, sess, step) {
  const out = [];
  ranges.forEach(([s, e]) => { let t = U.toMin(s); const end = U.toMin(e); while (t + sess <= end) { out.push(U.fromMin(t)); t += step; } });
  return out.sort();
}

function fullPayText(str, full) {
  if (!full) return str;
  /* {變數} 內的文字不改（例如 {本筆訂金} 不會被改成 {本筆費用}） */

const API_FRESH = {};
const api = {
  swrKey(action, data) { const u = Session.user() || {}; return 'mia.c.' + action + ':' + JSON.stringify(data || {}) + ':' + (u.lineUserId || ''); },
  cached(action, data) {
    if (IS_DEMO) return null;
    let c = null; try { c = JSON.parse(localStorage.getItem(this.swrKey(action, data)) || 'null'); } catch (e) { }
    return c && c.v === (CFG.VERSION || '') && Date.now() - c.at < 7 * 864e5 ? c.d : null;
  },
  fresh(action, data, force) {
    const k = this.swrKey(action, data), f = API_FRESH[k];
    if (f && !force && Date.now() - f.at < 60000) return f.p;
    const p = this.call(action, data).then(r => { if (!IS_DEMO) { try { localStorage.setItem(k, JSON.stringify({ v: CFG.VERSION || '', at: Date.now(), d: r })); } catch (e) { } } return r; }).catch(e => { delete API_FRESH[k]; throw e; });
    API_FRESH[k] = { p, at: Date.now() }; return p;
  },
  swr(action, data, onFresh) {
    const c = this.cached(action, data);
    if (!c) return this.fresh(action, data);
    const old = JSON.stringify(c);
    this.fresh(action, data).then(r => { const ch = JSON.stringify(r) !== old; if (onFresh) onFresh(r, ch); else if (ch) App.refreshSoft(); }).catch(() => { });
    return Promise.resolve(c);
  },
  async call(action, data) {
    const token = Session.token();
    try {
      if (IS_DEMO) return await MOCK.call(action, data, token);
      const res = await fetch(CFG.GAS_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action, token, data: data || {} }) });
      const j = await res.json();
      if (!j.ok) throw new ApiError(j.error && j.error.code || 'INTERNAL', j.error && j.error.message);
      return j.data;
    } catch (e) {
      if (!(e instanceof ApiError)) e = new ApiError('INTERNAL', '無法連線到預約系統，請稍後再試');
      if (['AUTH_EXPIRED', 'AUTH_INVALID'].includes(e.code)) { Session.clear(); }
      throw e;
    }
  }
};

/* pager (SPEC_v2 §2.2): returns HTML for .pager and binds via delegation. state = {page, pageSize, sizes?:number[]|false (default [20,50,100])}; onPage(page, pageSize). */
const Pagers = { n: 0, fns: {} };
function pager(state, total, onPage) {

  else { add(1); if (page > 4) add('…'); for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) add(i); if (page < pages - 3) add('…'); add(pages); if (page <= 4 && nums.indexOf(2) < 0) nums.splice(1, 0, 2); }

  return `<nav class="pager" data-pager="${id}" data-page="${page}" data-ps="${ps}" aria-label="分頁"><span class="rng">第 ${a.toLocaleString('en-US')}–${z.toLocaleString('en-US')} 筆／共 ${(+total || 0).toLocaleString('en-US')} 筆</span>${sizeSel}`
    + `<button type="button" class="pg" data-pg="${page - 1}"${page <= 1 ? ' disabled' : ''} aria-label="上一頁">${ic('left')}</button>`
    + nums.map(n => n === '…' ? '<span class="pg gap">…</span>' : `<button type="button" class="pg${n === page ? ' on' : ''}" data-pg="${n}"${n === page ? ' aria-current="page"' : ''}>${n}</button>`).join('')
    + `<button type="button" class="pg" data-pg="${page + 1}"${page >= pages ? ' disabled' : ''} aria-label="下一頁">${ic('right')}</button></nav>`;

const LineAuth = {

  start(area, returnHash) {
    const state = U.rid(12), nonce = U.rid(12);

    const p = new URLSearchParams({ response_type: 'code', client_id: CFG.LINE_LOGIN_CHANNEL_ID, redirect_uri: this.redirectUri(), state, scope: 'openid profile', nonce });
    if (area !== 'admin') p.set('bot_prompt', 'aggressive');

  },
  async handleReturn() {
    const qs = new URLSearchParams(location.search);

  hash(base, obj, defs) {

  /** text input with live counter. opt {key, label, max, value, ph, type:'text'|'textarea', req, help, ro} */

  async fillBadges(root) {

     預約總覽  日／週／月

  async overview(root) {
    const q = AUI.q(); const T = U.today();
    const view = ['day', 'week', 'month'].includes(q.view) ? q.view : this.state.overviewView;
    this.state.overviewView = view; U.ls.set('mia.admin.ov', view);
    const date = /^\d{4}-\d{2}-\d{2}$/.test(q.date || '') ? q.date : T;
    const planId = q.plan || '';
    const [o, { plans }] = await Promise.all([api.call('adminGetOverview', { date, view, planId }), this.plansCached()]);
    const go = (obj) => App.go(AUI.hash('#/admin', Object.assign({ view, date, plan: planId }, obj), { view: 'week-x', date: T }));
    const seg = `<div class="seg ov-seg" role="tablist" aria-label="檢視">${[['day', '日', 'cal-d'], ['week', '週', 'cal-w'], ['month', '月', 'cal-m']].map(([k, l]) => `<button role="tab" aria-selected="${k === view}" class="${k === view ? 'on' : ''}" data-view="${k}">${l}</button>`).join('')}</div>`;
    const planSel = `<select class="inp sel-s" data-plan aria-label="方案篩選"><option value="">全部方案</option>${plans.map(p => `<option value="${p.planId}" ${p.planId === planId ? 'selected' : ''}>${U.esc(p.name)}</option>`).join('')}</select>`;
    const actions = `${planSel}<a class="btn ghost sm hide-m" href="#/admin/settings/slots">${ic('clock')}時段設定</a>`;
    const pri = `<button class="btn pri sm" data-newbk>${ic('plus')}<span>新增預約</span></button>`;
    let body = '';
    if (view === 'month') body = this.monthView(o, date, plans);
    else if (view === 'day') body = this.dayView(o, date);
    else body = this.weekView(o, date);
    if (o.kpi && o.kpi.pendingCheck != null) this._pendPay = o.kpi.pendingCheck;
    const html = this.shell({ title: '今日', seg, mirror: '預約流程・選擇時段', actions, pri }, body);
    this.mount(root, html, r => {
      r.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go({ view: b.dataset.view })));
      r.querySelector('[data-plan]').addEventListener('change', e => go({ plan: e.target.value }));
      r.querySelectorAll('[data-newbk]').forEach(b => b.addEventListener('click', () => this.newBooking({ date: b.dataset.date || (view === 'week' ? '' : date) })));
      r.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
        const n = +b.dataset.nav; let d = date;
        if (b.dataset.nav === '0') d = T; else if (view === 'month') d = U.addMonths(date, n); else d = U.addDays(date, view === 'week' ? 7 * n : n);
        go({ date: d });
      }));
      r.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-newbk]')) return; this.monthSelect(r, b.dataset.day, planId); }));
      r.querySelectorAll('[data-dayview]').forEach(b => b.addEventListener('click', () => go({ view: 'day', date: b.dataset.dayview })));
      this.bindBookingActions(r);
    });
  },
  kpiRow(k) {
    const kp = (lbl, icn, cls, v, unit, ft, href) => `<a class="card kpi" href="${href}"><span class="lbl"><span class="ico ${cls}">${ic(icn)}</span>${lbl}</span><span class="v num">${v}<small>${unit}</small></span><span class="ft">${ft}</span><span class="go" aria-hidden="true">${ic('right')}</span></a>`;
    return `<div class="kpis">
      ${kp('本週預約', 'cal', 'c1', k.weekBookings, '筆', `${k.weekDelta >= 0 ? `<span class="up">↑ ${k.weekDelta}</span>` : `<span class="dn">↓ ${-k.weekDelta}</span>`} 較上週・額滿 ${k.fullDays} 天`, '#/admin/bookings')}
      ${kp('待對帳', 'coin', 'c2', k.pendingCheck, '筆', k.pendingCheck ? '<span class="dn">需確認收款</span>' : '目前沒有待對帳', '#/admin/payments/checking')}
      ${kp('待寄連結', 'video', 'c3', k.pendingLink, '筆', k.pendingLinkToday ? `<span class="dn">${k.pendingLinkToday} 筆三天內服務</span>` : '三天內無待寄', '#/admin/bookings?status=' + (this.full() ? 'CONFIRMED' : 'DEPOSIT_PAID'))}
      ${kp('陪伴中', 'heart', 'c4', k.companionActive, '位', `本週結束 ${k.companionEndingThisWeek} 位・報告待交 ${k.reportsPending}`, '#/admin/companions')}
    </div>`;
  },
  /** 近期待辦: grouped by date (today first; overdue items fold into 今天). In full mode 尾款 items are dropped. */
  todoItems(todos) {
    const full = this.full();
    return (todos || []).filter(t => t.booking && !(full && (t.type === 'confirm_balance' || t.type === 'balance_due')));
  },
  todoRow(t) {
    const m = TODO_META[t.type] || ['待辦', 'bell', 'c1']; const b = t.booking;
    const lbl = this.full() && t.type === 'confirm_deposit' ? '確認付款' : m[0];
    const act = t.type === 'confirm_deposit' ? `<button class="btn pri sm" data-dep="${b.bookingId}">確認收款</button>` : t.type === 'confirm_balance' ? `<button class="btn pri sm" data-bal="${b.bookingId}">確認收款</button>` : t.type === 'send_link' ? `<button class="btn pri sm" data-link="${b.bookingId}">寄送連結</button>` : `<button class="btn ghost sm" data-open="${b.bookingId}">查看</button>`;
    return `<div class="it"><span class="ico ${m[2]}">${ic(m[1])}</span><div class="tx"><b>${lbl}・${U.esc(b.name)}</b><small class="num">${b.date < U.today() ? U.dot(b.date).slice(5) + ' ' : ''}${b.startTime}・${U.esc(b.bookingId)}</small></div>${act}</div>`;
  },
  dayHead(d) { const T = U.today(); return d === T ? '今天' : d === U.addDays(T, 1) ? '明天' : `${U.dot(d)}（${WD[U.dow(d)]}）`; },
  todoCard(todos, title, grouped) {
    const list = this.todoItems(todos); const T = U.today(); const MAX = 12;
    let body = '';
    if (!list.length) body = '<p class="none">待辦都完成了</p>';
    else if (!grouped) body = list.slice(0, 8).map(t => this.todoRow(t)).join('');
    else {
      const key = t => (t.booking.date < T ? T : t.booking.date);
      const sorted = list.slice().sort((a, b) => (key(a) + a.booking.startTime).localeCompare(key(b) + b.booking.startTime) || a.booking.date.localeCompare(b.booking.date));
      const shown = sorted.slice(0, MAX); let cur = '';
      shown.forEach(t => { const k = key(t); if (k !== cur) { cur = k; body += `<h5 class="tdh num ${k === T ? 'now' : ''}">${this.dayHead(k)}</h5>`; } body += this.todoRow(t); });
      if (sorted.length > MAX) body += `<a class="btn txt sm more" href="#/admin/payments/checking">還有 ${sorted.length - MAX} 項 ›</a>`;
    }
    return `<section class="card"><header class="ch"><h3>${title || '近期待辦'}</h3><span class="sub num">${list.length} 項</span></header><div class="cb todo ${grouped ? 'grp' : ''}">${body}</div></section>`;
  },
  weekView(o, date) {
    const T = U.today(); const k = o.kpi;
    const evCls = s => ({ 's-dep': 'e-dep', 's-check': 'e-check', 's-full': 'e-full', 's-unpaid': 'e-unpaid', 's-link': 'e-link', 's-done': 'e-done', 's-noshow': 'e-ns' }[s] || '');
    const isThisWeek = U.weekStart(date) === U.weekStart(T);
    return `${this.kpiRow(k)}
      <div class="g2">
        <div class="stack">
          <section class="card"><header class="ch"><h3>今日行程</h3><span class="sub num">${U.dateLabel(T)}</span>${o.today.items.length ? `<div class="r"><span class="capb num">已預約 ${o.today.used} / ${o.today.cap}<span class="load" style="--p:${Math.min(1, o.today.used / Math.max(1, o.today.cap))}"><i></i></span></span></div>` : ''}</header>
            <div class="cb">${o.today.items.length ? o.today.items.map(b => `<div class="trow"><span class="tm num">${b.startTime}<small>– ${b.endTime}</small></span><span class="who"><b>${U.esc(b.name)}</b><small>${AUI.tagPlan(b.planStyle, b.planName)}<span class="num">${U.esc(b.bookingId)}</span></small></span><span class="st ${b.statusClass}">${b.statusLabel}</span><span class="acts">${b.zoomLink ? `<a class="btn ghost sm" href="${U.esc(b.zoomLink)}" target="_blank" rel="noopener">${ic('video')}Zoom</a>` : ''}<button class="btn soft sm" data-open="${b.bookingId}">明細</button></span></div>`).join('') : '<p class="none">今天沒有預約行程</p>'}</div></section>
          <section class="card"><header class="ch"><h3>本週時段</h3><span class="sub num">${U.dot(o.week.start).slice(5)} – ${U.dot(o.week.end).slice(5)}</span><div class="r nav2"><button class="ib" data-nav="-1" aria-label="上一週">${ic('left')}</button>${isThisWeek ? '' : '<button class="btn txt sm" data-nav="0">回到本週</button>'}<button class="ib" data-nav="1" aria-label="下一週">${ic('right')}</button></div></header>
            <div class="cb"><div class="week">${o.week.days.map(d => `<div class="wk ${d.date === T ? 'now' : ''} ${d.off ? 'off' : ''} ${d.date < T ? 'past' : ''}"><div class="dh"><button class="dnum num" data-dayview="${d.date}" aria-label="查看 ${U.dateLabel(d.date)}">${+d.date.slice(8)}</button><span>週${WD[d.weekday]}</span>${d.date >= T ? `<button class="add" data-newbk data-date="${d.date}" aria-label="在 ${U.dateLabel(d.date)} 新增預約" title="新增預約">${ic('plus')}</button>` : ''}</div>${d.off && !d.events.length ? '<div class="offl">不開放</div>' : d.events.map(e => `<button class="ev ${evCls(e.statusClass)}" data-open="${e.bookingId}"><b class="num">${e.time}</b><span>${U.esc(e.name)}</span></button>`).join('') + (d.free || []).map(t => `<span class="ev free num">${t}</span>`).join('')}</div>`).join('')}</div>
            <p class="lgd"><span><i class="e-dep"></i>訂金已付</span><span><i class="e-check"></i>待對帳</span><span><i class="e-unpaid"></i>待付訂金</span><span><i class="free"></i>仍可預約</span></p></div></section>
        </div>
        <div class="stack">
          ${this.todoCard(o.todos, '近期待辦', true)}
          <section class="card"><header class="ch"><h3>陪伴追蹤</h3><div class="r"><a class="btn txt sm" href="#/admin/companions">全部 ›</a></div></header><div class="cb comp">${o.companions.length ? o.companions.slice(0, 5).map(c => `<div class="it"><span class="who"><b>${U.esc(c.name)}</b><small>${U.esc(c.planName)}</small></span><span class="dd num">第 ${c.day} / ${c.total} 天</span><span class="load ${c.day >= c.total - 2 ? 'end' : ''}" style="--p:${c.day / c.total}"><i></i></span></div>`).join('') : '<p class="none">目前沒有陪伴中的客人</p>'}</div></section>
        </div>
      </div>`;
  },
  dayView(o, date) {
    const T = U.today(); const d = o.day || { date, items: [], free: [], cap: 0, used: 0, state: 'closed', weekday: U.dow(date) };
    const rows = d.items.map(b => ({ t: b.startTime, b })).concat((d.free || []).map(t => ({ t }))).sort((a, b) => a.t.localeCompare(b.t));
    const stLabel = { off: '不在開放範圍', closed: '休息日', open: `空 ${(d.free || []).length}`, full: '滿檔' }[d.state] || '';
    const todos = (o.todos || []).filter(t => t.booking && t.booking.date === date);
    return `${this.kpiRow(o.kpi)}
      <div class="g2">
        <section class="card"><header class="ch day-h"><div class="nav2"><button class="ib" data-nav="-1" aria-label="前一天">${ic('left')}</button><h3 class="num">${U.dateLabel(date, true)}</h3><button class="ib" data-nav="1" aria-label="後一天">${ic('right')}</button>${date === T ? '' : '<button class="btn txt sm" data-nav="0">回到今天</button>'}</div>
          <div class="r"><span class="mark ${d.state === 'full' ? 'full' : d.state === 'open' ? 'free' : 'off'}">${stLabel}</span>${d.items.length ? `<span class="capb num">已預約 ${d.used} / ${d.cap}<span class="load" style="--p:${d.cap ? Math.min(1, d.used / d.cap) : 0}"><i></i></span></span>` : ''}</div></header>
          <div class="cb">${d.items.length ? '' : `<p class="none tl-none">${date === T ? '今天沒有預約行程' : '這天沒有預約行程'}${d.state === 'closed' ? '<small>這天休息，不開放預約</small>' : d.state === 'off' ? '<small>這天不在前台開放範圍內</small>' : (d.free || []).length ? '<small>以下時段前台仍可預約</small>' : ''}</p>`}<ol class="tl">${rows.length ? rows.map(x => x.b ? `<li class="slot"><span class="tm num">${x.b.startTime}<small>${x.b.endTime}</small></span><div class="sb"><span class="who"><b>${U.esc(x.b.name)}</b><small>${AUI.tagPlan(x.b.planStyle, x.b.planName)}<span class="num">${U.esc(x.b.phone || '')}</span></small></span><span class="st ${x.b.statusClass}">${x.b.statusLabel}</span>${this.rowActions(x.b)}</div></li>`
            : `<li class="slot free"><span class="tm num">${x.t}</span><div class="sb"><span class="fr">空檔・前台可預約</span>${date >= T ? `<button class="btn ghost sm" data-newbk data-date="${date}">${ic('plus')}新增</button>` : ''}</div></li>`).join('') : ''}</ol></div></section>
        <div class="stack">
          ${date === T ? this.todoCard(o.todos, '近期待辦', true) : this.todoCard(todos, '當日待辦')}
          <section class="card"><header class="ch"><h3>快速操作</h3></header><div class="cb qa">
            <button class="btn pri" data-newbk data-date="${date}">${ic('plus')}新增這天的預約</button>
            <a class="btn ghost" href="#/admin/bookings?from=${date}&to=${date}">${ic('list')}開啟當日清單</a>
            <a class="btn ghost" href="#/admin/settings/slots">${ic('clock')}調整這天的時段</a></div></section>
        </div>
      </div>`;
  },
  monthView(o, date) {
    const T = U.today(); const m = o.month || { days: [], summary: {} }; const ms = U.monthStart(date);
    const lead = m.days.length && m.days[0].date === ms ? U.dow(ms) : 0;
    const cells = []; for (let i = 0; i < lead; i++) cells.push(`<div class="day out" aria-hidden="true"><span class="d num">${+U.addDays(ms, i - lead).slice(8)}</span></div>`);
    m.days.forEach(d => {
      const out = d.date.slice(0, 7) !== ms.slice(0, 7);
      const mk = d.state === 'full' ? '<span class="mark full">滿檔</span>' : (d.state === 'closed' ? '<span class="mark off">休</span>' : (d.state === 'open' && !d.used && d.date >= T ? '<span class="mark none">尚無預約</span>' : ''));
      const p = d.cap ? Math.min(1, d.used / d.cap) : 0;
      cells.push(`<div class="day ${out ? 'out' : ''} ${d.date === T ? 'today' : ''} ${d.date === date ? 'sel' : ''} ${d.state} ${d.date < T ? 'past' : ''}" data-day="${d.date}" role="button" tabindex="0" aria-label="${U.dateLabel(d.date)} ${d.used}/${d.cap}">
        <span class="d"><span class="num dnum">${+d.date.slice(8)}</span><small class="wdl">週${WD[U.dow(d.date)]}</small>${mk}</span>
        ${d.state === 'open' || d.state === 'full' || d.used ? `<span class="load" style="--p:${p}"><i></i></span><span class="cnt num"><b>${d.used}／${d.cap}</b>${d.free ? `<span>空 ${d.free}</span>` : ''}</span>` : ''}
        <span class="dots">${(d.dots || []).slice(0, 8).map(s => `<i class="p-${s}"></i>`).join('')}</span>
        ${d.date >= T && d.state !== 'closed' ? `<button class="add" data-newbk data-date="${d.date}" aria-label="在 ${U.dateLabel(d.date)} 新增預約" title="新增預約">${ic('plus')}</button>` : ''}</div>`);
    });
    while (cells.length % 7) cells.push('<div class="day out" aria-hidden="true"></div>');
    const s = m.summary || {};
    return `<div class="mwrap">
      <section class="card cal"><header class="mhead"><h2 class="num">${ms.slice(0, 4)}.${ms.slice(5, 7)}</h2><div class="nav2"><button class="ib" data-nav="-1" aria-label="上個月">${ic('left')}</button><button class="ib" data-nav="1" aria-label="下個月">${ic('right')}</button></div>${ms.slice(0, 7) !== T.slice(0, 7) ? '<button class="btn txt sm" data-nav="0">回到今天</button>' : ''}
        <div class="lg"><span><i class="lb"></i>已預約／可預約</span><span class="mark full">滿檔</span><span class="mark off">休</span>未開放</div></header>
        <div class="mgrid">${['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="wd">${w}</div>`).join('')}${cells.join('')}</div></section>
      <aside class="stack">
        <section class="card selp" data-selp>${this.selPanel(o.selected, date)}</section>
        <section class="card"><header class="ch"><h3>本月概況</h3></header><div class="cb"><div class="sumg">
          <div><small>已預約</small><b class="num">${s.booked || 0}</b><span>／可預約 ${s.capacity || 0}</span></div>
          <div><small>滿檔日</small><b class="num">${s.fullDays || 0}</b><span>天</span></div>
          <div><small>剩餘時段</small><b class="num">${s.freeSlots || 0}</b><span>個</span></div>
          <div><small>待對帳</small><b class="num">${s.pendingCheck || 0}</b><span>筆</span></div></div></div></section>
      </aside></div>`;
  },
  selPanel(sel, date) {
    sel = sel || { date, items: [], cap: 0, used: 0, state: 'closed' };
    const free = Math.max(0, (sel.cap || 0) - (sel.used || 0));
    const T = U.today();
    return `<header class="ch"><h3 class="num">${U.dateLabel(sel.date || date)}</h3><span class="sub">${sel.state === 'closed' ? '休息日' : sel.state === 'off' ? '未開放' : `${sel.cap} 個時段・${sel.state === 'full' ? '已滿' : '空 ' + free}`}</span></header>
      <div class="cb"><ul class="dlist">${(sel.items || []).length ? sel.items.map(b => `<li><button data-open="${b.bookingId}"><span class="t num">${b.startTime}</span><span class="who"><b>${U.esc(b.name)}</b><small>${U.esc(b.planName)}</small></span><span class="st ${b.statusClass}">${b.statusLabel}</span></button></li>`).join('') : '<li class="none">這天沒有預約</li>'}</ul>
      <div class="selbtns"><a class="btn ghost full" href="#/admin/bookings?from=${sel.date || date}&to=${sel.date || date}">開啟當日清單</a>${(sel.date || date) >= T && sel.state !== 'closed' ? `<button class="btn soft full" data-newbk data-date="${sel.date || date}">${ic('plus')}新增這天的預約</button>` : ''}</div></div>`;
  },
  async monthSelect(r, d, planId) {
    r.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel')); const c = r.querySelector(`[data-day="${d}"]`); if (c) c.classList.add('sel');
    AUI.replace(AUI.hash('#/admin', { view: 'month', date: d, plan: planId }));

      const o = await api.call('adminGetOverview', { date: d, view: 'month', planId });
      const p = r.querySelector('[data-selp]'); p.innerHTML = this.selPanel(o.selected, d); this.bindBookingActions(p);
      p.querySelectorAll('[data-newbk]').forEach(b => b.addEventListener('click', () => this.newBooking({ date: b.dataset.date })));
      if (AUI.bp() === 'm') p.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) { errToast(e); }
  },

  /* ---------- shared booking actions ---------- */
  bindBookingActions(r) {
    const on = (sel, fn) => r.querySelectorAll(sel).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); fn(b); }));
    on('[data-open]', b => this.bookingDrawer(b.dataset.open));
    on('[data-dep]', b => this.confirmPay(b.dataset.dep, 'deposit'));
    on('[data-bal]', b => this.confirmPay(b.dataset.bal, 'balance'));
    on('[data-link]', b => this.zoomDialog(b.dataset.link));
    on('[data-done]', b => this.markDone(b.dataset.done));
    on('[data-more]', b => this.moreMenu(b, b.dataset.more, b.dataset.st));
  },
  after(msg) { if (msg) toast(msg, 'ok'); AUI.closeDrawer(); this.bust(); this.rerender(); },
  async confirmPay(id, kind) {
    const { booking: b } = await api.call('adminGetBooking', { bookingId: id });
    const isDep = kind === 'deposit';
    const ok = await modal({
      title: isDep ? (this.full() ? '確認付款' : '確認訂金收款') : '確認尾款收款', ok: '確認收款',
      html: `<dl class="kv"><dt>預約</dt><dd>${U.esc(b.name)}・<span class="num">${U.esc(b.bookingId)}</span></dd><dt>金額</dt><dd class="num">${U.money(isDep ? b.deposit : b.balance)}</dd><dt>付款方式</dt><dd>${(PAY_META[isDep ? b.depositMethod : b.balanceMethod] || {}).label || '—'}</dd><dt>參考碼</dt><dd class="num">${U.esc((isDep ? b.depositRef : b.balanceRef) || '—')}</dd></dl><p class="mnote">確認後會由官方 LINE 傳送「${isDep ? (this.full() ? '付款確認' : '訂金確認') : '尾款確認'}」通知給客人。</p>`,
      onOk: () => api.call(isDep ? 'adminConfirmDeposit' : 'adminConfirmBalance', { bookingId: id })
    });
    if (ok) this.after('已確認收款');
  },
  async zoomDialog(id) {
    const { booking: b } = await api.call('adminGetBooking', { bookingId: id });

  /* v5.4：日期例外＝休假（全天不開放）／這天改時段（任何一天都能用、可多段）；可直接修改；重疊時詢問是否取代（設計稿第 25 排） */
  async overrideDialog(date, data, re, ov, ctxA) {
    const R = ctxA.R, W = ctxA.W, genFor = ctxA.genFor;
    const weekRanges = d => { const w = W.find(x => +x.weekday === U.dow(d)); return w && w.enabled ? U.clone(w.ranges) : []; };
    const st = { type: ov ? ov.type : 'closed', from: ov ? ov.dateFrom : date, to: ov ? ov.dateTo : date, note: ov ? ov.note || '' : '', ranges: ov && ov.type === 'open' ? U.clone(ov.ranges) : weekRanges(date) };
    if (!st.ranges.length) st.ranges = [['10:00', '12:00']];
    const rangeHTML = () => `${st.ranges.map((r, i) => `<span class="rg ovr"><input class="num" type="time" data-ovr="${i}:0" value="${r[0]}" aria-label="開始"> – <input class="num" type="time" data-ovr="${i}:1" value="${r[1]}" aria-label="結束"><button type="button" class="x" data-ovrx="${i}" aria-label="移除這段">${ic('x')}</button></span>`).join('')}<button type="button" class="tlink sm" data-ovra>${ic('plus')}新增一段</button>`;
    const pvHTML = () => { const g = genFor(st.ranges); return g.length ? `<span class="chips2">${g.map(x => `<span class="num">${x}</span>`).join('')}</span><small>產生 ${g.length} 個時段（每場 ${R.sessionMinutes} 分鐘＋緩衝 ${R.bufferMinutes} 分鐘）</small>` : '<small class="dn">這些時段排不出任何一場，請調整</small>'; };
    const wkHint = () => { const wr = weekRanges(st.from); return wr.length ? `取代每週${WD[U.dow(st.from)]}的 ${wr.map(r => r.join('–')).join('、')}` : `週${WD[U.dow(st.from)]}原本休息，這天只開放以下時段`; };
    let saved = null;
    const ok = await modal({
      title: ov ? '修改日期例外' : '新增日期例外', ok: '儲存',
      html: `<div class="seg sm ov-seg" style="margin-bottom:14px"><button type="button" data-ty="closed" class="${st.type === 'closed' ? 'on' : ''}">休假（全天不開放）</button><button type="button" data-ty="open" class="${st.type === 'open' ? 'on' : ''}">這天改時段</button></div>
        <div class="row2"><label class="fld"><span class="lbl">開始日期</span><input class="inp" type="date" id="of" value="${st.from}"></label><label class="fld"><span class="lbl">結束日期</span><input class="inp" type="date" id="ot" value="${st.to}"></label></div>
        <div class="fld ov-open ${st.type === 'open' ? '' : 'hide'}"><span class="lbl"><span>這天開放的時段</span><small data-wkh>${wkHint()}</small></span><div class="ov-rgs" data-rgs>${rangeHTML()}</div>
          <span class="lbl" style="margin-top:10px">前台會看到</span><div class="gen ov-pv" data-ovpv>${pvHTML()}</div></div>
        ${AUI.field({ label: '備註', id: 'on', max: 30, ph: '例如：出國、下午才有空', value: st.note })}
        ${ov ? `<p style="margin:6px 0 0"><button type="button" class="btn danger sm" data-ovdel>刪除這個例外</button></p>` : ''}`,
      onOpen(sc, close) {
        const paint = () => { sc.querySelector('[data-rgs]').innerHTML = rangeHTML(); sc.querySelector('[data-ovpv]').innerHTML = pvHTML(); bind(); };
        const bind = () => {
          sc.querySelectorAll('[data-ovr]').forEach(i => i.addEventListener('change', () => { const [ix, k] = i.dataset.ovr.split(':').map(Number); st.ranges[ix][k] = i.value; sc.querySelector('[data-ovpv]').innerHTML = pvHTML(); }));
          sc.querySelectorAll('[data-ovrx]').forEach(b => b.addEventListener('click', () => { st.ranges.splice(+b.dataset.ovrx, 1); if (!st.ranges.length) st.ranges.push(['10:00', '12:00']); paint(); }));
          const ad = sc.querySelector('[data-ovra]'); if (ad) ad.addEventListener('click', () => { const last = st.ranges[st.ranges.length - 1]; const a = last ? U.fromMin(Math.min(22 * 60, U.toMin(last[1]) + 30)) : '10:00'; st.ranges.push([a, U.fromMin(Math.min(23 * 60 + 59, U.toMin(a) + 90))]); paint(); });
        };
        bind();
        sc.querySelectorAll('[data-ty]').forEach(b => b.addEventListener('click', () => { st.type = b.dataset.ty; sc.querySelectorAll('[data-ty]').forEach(x => x.classList.toggle('on', x === b)); sc.querySelector('.ov-open').classList.toggle('hide', st.type !== 'open'); }));
        sc.querySelector('#of').addEventListener('change', e => { const v = e.target.value; const t = sc.querySelector('#ot'); if (!t.value || t.value < v || t.value === st.from) t.value = v; st.from = v; if (!ov) { const wr = weekRanges(v); if (wr.length) st.ranges = wr; paint(); } sc.querySelector('[data-wkh]').textContent = wkHint(); });
        const del = sc.querySelector('[data-ovdel]'); if (del) del.addEventListener('click', async () => { if (!await confirmBox('刪除例外日', '<p>刪除後這幾天恢復每週時段規則。</p>', '刪除', true)) return; try { const x = await api.call('adminDeleteOverride', { overrideId: ov.overrideId }); data.overrides = x.overrides; App.cfg = null; close(null); toast('已刪除例外日', 'ok'); re(); } catch (e) { errToast(e); } });
      },
      onOk: async sc => {
        const o = { overrideId: ov ? ov.overrideId : undefined, dateFrom: sc.querySelector('#of').value, dateTo: sc.querySelector('#ot').value || sc.querySelector('#of').value, type: st.type, ranges: st.type === 'open' ? st.ranges.filter(r => r[0] && r[1]) : [], note: sc.querySelector('#on').value };
        const chk = await api.call('adminSaveOverride', { override: o, dryRun: true });
        const lab = x => `${U.dot(x.dateFrom)}${x.dateTo !== x.dateFrom ? ' – ' + U.dot(x.dateTo).slice(5) : ''}（${x.type === 'open' ? '改時段：' + x.ranges.map(r => r.join('–')).join('、') : '休假'}）`;
        const parts = [];
        if (chk.overlaps.length) parts.push(`<p>這段日期已經有例外：</p><ul class="mlist">${chk.overlaps.map(x => `<li class="num">${U.esc(lab(x))}</li>`).join('')}</ul><p>要改成新的設定嗎？只會取代重疊的日期，其他天的例外不動。</p>`);
        if (chk.conflicts.length) parts.push(`<p class="dn">有 ${chk.conflicts.length} 筆預約不在新的時段裡（預約不會被取消，請記得聯絡客人改期）：</p><ul class="mlist">${chk.conflicts.map(b => `<li class="num">${U.dot(b.date)} ${U.esc(b.startTime)}・${U.esc(b.name)}</li>`).join('')}</ul>`);
        if (parts.length && !await confirmBox(chk.overlaps.length ? '這段日期已經有例外' : '有預約不在新的時段裡', parts.join(''), chk.overlaps.length ? '改成新的設定' : '仍要儲存')) return false;
        saved = await api.call('adminSaveOverride', { override: o, replace: true });
        return saved;
      }
    });
    if (ok) { data.overrides = ok.overrides; App.cfg = null; toast(ov ? '已修改例外日，前台已同步' : '已新增例外日，前台已同步', 'ok'); re(); }
  },

  logState(base) { const q = AUI.q(); const T = U.today(); return { type: q.type || '', status: q.status || '', q: q.q || '', from: q.from != null ? q.from : U.addDays(T, -30), to: q.to != null ? q.to : T, page: Math.max(1, +q.page || 1), ps: [20, 50, 100].includes(+q.ps) ? +q.ps : 50 }; },
  logHash(base, s) { const T = U.today(); return AUI.hash(base, s, { from: U.addDays(T, -30), to: T, page: 1, ps: 50 }); },
  rangeChip(s) { const T = U.today(); const def = s.from === U.addDays(T, -30) && s.to === T; return `<button class="fbtn on" data-lrange>${ic('cal')}<span class="num">${def ? '近 30 天' : !s.from && !s.to ? '全部日期' : `${U.dot(s.from) || '…'} – ${U.dot(s.to) || '…'}`}</span>${ic('down', 'cv')}</button>`; },
  diffHtml(a) {
    let b = {}, c = {}; const parse = x => (x && typeof x === 'object') ? x : JSON.parse(x || '{}'); try { b = parse(a.before); c = parse(a.after); } catch (e) { }
    const keys = Array.from(new Set(Object.keys(b).concat(Object.keys(c)))).slice(0, 6);
    const v = x => x === true ? '是' : x === false ? '否' : x == null || x === '' ? '空' : typeof x === 'object' ? JSON.stringify(x).slice(0, 60) : String(x).slice(0, 60);
    return keys.length ? keys.map(k => `${U.esc(FIELD_LABEL[k] || k)}：<del>${U.esc(v(b[k]))}</del> → <ins>${U.esc(v(c[k]))}</ins>`).join('<br>') : U.esc(a.note || '—');
  },

    }));

      r.querySelectorAll('[data-smode]').forEach(b => b.addEventListener('click', () => { this.evSync(); W.sessions[+b.closest('[data-si]').dataset.si].mode = b.dataset.smode; this.evRender(); }));

  /* ---------- 報名名單（F3） ---------- */
  async evRoster(root, eventId) {
    const sid = new URLSearchParams(location.hash.split('?')[1] || '').get('s') || '';
    const x = await api.call('adminGetRoster', { eventId, sessionId: sid }), ev = x.event, cur = ev.sessions.find(s => s.sessionId === x.sessionId);
    if (!cur) { this.mount(root, this.shell({ title: '課程' }, AUI.empty('這個活動還沒有場次'))); return; }
    const paid = x.regs.filter(r => r.status === 'PAID'), hold = x.regs.filter(r => r.status === 'HOLD' || r.status === 'OFFER'), chk = paid.filter(r => r.checkedIn).length;
    const mask = p => String(p || '').replace(/^(\d{4})\d{3}(\d{3})$/, '$1•••$2');
    const left = r => { const due = r.status === 'OFFER' ? r.offerUntil : r.holdUntil; if (!due) return ''; const h = Math.max(0, Math.round((Date.parse(due) - Date.now()) / 36e5)); return h >= 1 ? `剩 ${h} 小時` : '即將逾時'; };
    const payTxt = r => r.status === 'PAID' ? `${U.esc(r.methodLabel)}` : (r.status === 'HOLD' || r.status === 'OFFER') ? (r.atm ? `ATM 待入帳・${left(r)}` : `待付款・${left(r)}`) : r.refund === 'MANUAL' ? '<b class="warn-t">待人工退款</b>' : r.refund === 'REFUNDED' ? '已退款' : r.refund === 'MANUAL_DONE' ? '已人工退款' : '—';
    const row = r => `<tr class="${['CANCELLED'].includes(r.status) ? 'dis' : ''}"><td class="num">${U.esc(r.regId)}</td><td><b>${U.esc(r.name)}</b>${r.note ? `<small>${U.esc(r.note)}</small>` : ''}</td><td class="num">${U.esc(mask(r.phone))}</td><td>${this.evRegChip(r)}<small>${payTxt(r)}</small></td><td class="num">${r.method === 'free' ? '免費' : U.money(r.amount)}${r.early ? '<small>早鳥</small>' : ''}</td><td class="num">${U.dot(r.createdAt.slice(0, 10)).slice(5)} ${r.createdAt.slice(11, 16)}</td>
      <td>${r.status === 'PAID' ? AUI.cbx(r.checkedIn, `data-chk="${r.regId}"`, '報到：' + r.name) : '—'}</td>
      <td class="acts">${r.status === 'PAID' && ev.sessions.filter(s => s.sessionId !== cur.sessionId && !s.cancelled && s.state !== 'ended').length ? `<button class="btn ghost sm" data-move="${r.regId}">轉場次</button>` : ''}${['PAID', 'HOLD', 'OFFER'].includes(r.status) ? `<button class="btn ghost sm" data-rcancel="${r.regId}">取消</button>` : ''}${r.refund === 'MANUAL' ? `<button class="btn soft sm" data-refunded="${r.regId}">已退款</button>` : ''}</td></tr>`;
    const html = this.shell({ title: '課程', mirror: '我的預約・課程', sub: `<a class="lnk" href="#/admin/events/e/${ev.eventId}">${ic('left')}${U.esc(ev.title)}</a>`,
      actions: `<button class="btn ghost sm" data-csv>${ic('doc')}匯出 CSV</button>`, pri: `<button class="btn pri sm" data-msg>${ic('send')}<span>LINE 訊息給這個場次</span></button>` }, `
      <h2 class="ev-rh">報名名單・${U.esc(ev.title)}</h2>
      <div class="ev-stabs">${ev.sessions.map((s, i) => `<a class="ev-stab ${s.sessionId === cur.sessionId ? 'on' : ''}" href="#/admin/events/e/${ev.eventId}/roster?s=${s.sessionId}"><b>場次 ${i + 1}・<span class="num">${U.dot(s.lessons[0].date).slice(5)}</span></b><small>${U.esc(s.modeLabel)}・<span class="num">${s.taken}/${s.capacity}</span>${s.cancelled ? '・已取消' : ''}</small></a>`).join('')}</div>
      <div class="kpis ev-kpis"><div class="kpi card"><small>${ev.free ? '已報名' : '已付款'}</small><b class="num">${paid.length}</b><span>人</span></div><div class="kpi card"><small>待付款</small><b class="num">${hold.length}</b><span>人${hold.some(r => r.atm) ? '・ATM 待入帳' : ''}</span></div><div class="kpi card"><small>已報到</small><b class="num">${chk} / ${paid.length}</b><span>上課當天勾選</span></div><div class="kpi card"><small>候補</small><b class="num">${x.waitlist.length}</b><span>人</span></div></div>
      <section class="card flush"><header class="ch"><h3>${U.esc(cur.when)}・${U.esc(cur.modeLabel)}</h3>${cur.mode === 'online' && !cur.zoomLink ? '<span class="chip sm warn">尚未填 Zoom 連結</span>' : ''}</header>
        <div class="tbl-wrap"><table class="tbl ev-rt"><thead><tr><th>報名編號</th><th>姓名</th><th>手機</th><th>付款</th><th>金額</th><th>報名時間</th><th>報到</th><th></th></tr></thead><tbody>${x.regs.map(row).join('') || `<tr><td colspan="8">${AUI.empty('還沒有人報名')}</td></tr>`}</tbody></table></div>

        ${x.waitlist.length ? `<ol class="ev-wl">${x.waitlist.map((r, i) => `<li><span class="num">${i + 1}</span><b>${U.esc(r.name)}</b><small class="num">${U.dot(r.waitAt.slice(0, 10)).slice(5)} ${r.waitAt.slice(11, 16)} 加入</small><span class="sp"></span><button class="btn ghost sm" data-offer="${r.regId}">手動通知遞補</button></li>`).join('')}</ol>` : '<p class="muted">目前沒有人候補</p>'}</div></section>
      <p class="mnote">取消時可選「同時退款」：LINE Pay、綠界信用卡直接呼叫金流退款；綠界 ATM 無法自動退回，會標記「待人工退款」，你轉帳退款後按「已退款」。取消後名額立即釋出，自動通知候補第 1 位。</p>`);
    this.mount(root, html, r => {
      const reload = () => this.evRoster(root, eventId);

/* ---- admin-tarot.js ---- */
/* ===================== ADMIN v4：塔羅（待解讀・代碼管理・占卜紀錄・牌義內容 K1/K2）・總結報告（R1） ===================== */
const TAROT_TABS = [['pending', '待解讀'], ['codes', '代碼管理'], ['records', '占卜紀錄'], ['cards', '牌義內容']];
const trKindChip = k => `<span class="tr-kind ${k}">${U.esc((TAROT_CODE_KINDS[k] || ['—'])[0])}</span>`;
const trDue = r => r.codeKind === 'post' ? '整理進總結報告' : r.daysLeft == null ? '' : r.daysLeft < 0 ? `已超過交付期限 ${-r.daysLeft} 天` : r.daysLeft === 0 ? '今天要交付' : `交付期限：剩 ${r.daysLeft} 天`;
/* 讀檔成 base64（上傳到 Google 雲端；展示模式只存 1.5 MB 以下的內容） */
function readFileB64(file) { return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result)); fr.onerror = () => no(new ApiError('BAD_REQUEST', '無法讀取檔案')); fr.readAsDataURL(file); }); }
async function uploadFiles(files, ownerType, ownerId) {
  let n = 0;
  for (const f of Array.from(files || [])) {
    if (!RP_FILE_TYPES.includes(f.type)) { toast(f.name + '：只能上傳 PDF、JPG、PNG', 'err'); continue; }
    if (f.size > RP_FILE_MAX) { toast(f.name + '：超過 10 MB，請壓縮後再上傳', 'err'); continue; }
    try { const data = await readFileB64(f); const x = await api.call('adminUploadFile', { ownerType, ownerId, name: f.name, type: f.type, size: f.size, data }); n++; if (x.demoNoPreview) toast('展示模式只保存 1.5 MB 以下的檔案內容，正式版沒有這個限制'); } catch (e) { errToast(e); }
  }
  if (n) toast(`已上傳 ${n} 個檔案`, 'ok');
  return n;
}
const fileRows = (files, del) => files.map(f => `<div class="rp-f"><span class="rp-k ${f.type === 'application/pdf' ? 'pdf' : 'img'}">${FileView.kind(f.type)}</span><span class="rp-fn"><b>${U.esc(f.name)}</b><small class="num">${FileView.size(f.size)}・${U.tsLabel(f.uploadedAt).slice(5)} 上傳</small></span><button class="btn ghost sm" data-fopen="${U.esc(f.fileId)}">預覽</button>${del ? `<button class="btn ghost sm" data-fdel="${U.esc(f.fileId)}">移除</button>` : ''}</div>`).join('');
const dropZone = id => `<label class="rp-drop" data-drop="${id}"><input type="file" accept="application/pdf,image/jpeg,image/png" multiple hidden data-file="${id}">${ic('plus')}<span><b>拖曳或點選上傳 PDF、JPG、PNG</b><small>可多個檔案・每個 10 MB 以內・存在你的 Google 雲端「Mia 總結報告」資料夾，不公開</small></span></label>`;
function bindDrop(r, id, onFiles) {
  const z = r.querySelector(`[data-drop="${id}"]`), inp = r.querySelector(`[data-file="${id}"]`); if (!z) return;
  inp.addEventListener('change', () => { if (inp.files.length) onFiles(inp.files); });
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('on'); }); z.addEventListener('dragleave', () => z.classList.remove('on'));
  z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('on'); if (e.dataTransfer.files.length) onFiles(e.dataTransfer.files); });
}
const tlog = items => `<ol class="rp-log">${items.map(x => `<li class="${x.wait ? 'wait' : ''}"><span class="d">${x.wait ? '…' : ic('check')}</span><span><b>${U.esc(x.text)}</b>${x.ts ? `<small class="num">${U.tsLabel(x.ts).slice(5)}</small>` : ''}</span></li>`).join('')}</ol>`;
const fullGrid = (r, open) => tarotFullCells(r).map((p, k) => `<details class="tr-part" ${open || !k ? 'open' : ''}><summary>${p.s}・${p.n}</summary>${p.cells.map(c => `<div class="tr-cell"><b>${U.esc(c.l)}</b><span class="tr-th">${c.ids.map((id, j) => `<img src="${cardSrc(U.esc(id))}" alt="" loading="lazy" class="${j ? '' : 'mj'}" onerror="trImgErr(this)">`).join('')}</span><span class="tr-nm">${U.esc(c.names[0])}／${c.names.slice(1).map(U.esc).join('・')}</span></div>`).join('')}</details>`).join('');

      f('link').addEventListener('change', () => { const v = f('link').value; f('ev').hidden = v !== 'ev'; f('url').hidden = v !== 'url'; if (v && v !== 'ev' && v !== 'url' && !f('btnLabel').value.trim()) f('btnLabel').value = (NEWS_LINKS.find(l => l[0] === v) || [])[1] || ''; });
      d.querySelectorAll('[data-pub] [data-v]').forEach(b => b.addEventListener('click', () => { pub = b.dataset.v; d.querySelectorAll('[data-pub] [data-v]').forEach(x => x.classList.toggle('on', x === b)); f('publishAt').hidden = pub !== 'at'; }));
      if (AUI.bindSwitches) AUI.bindSwitches(d, () => { });
      const collect = () => {
        const lv = f('link').value, target = lv === 'ev' ? (f('ev').value ? '#/events/' + f('ev').value : '') : lv === 'url' ? f('url').value.trim() : lv;
        return { newsId: n.newsId, title: f('title').value.trim(), category: cat, body: f('body').value.trim(), cover: { type: cvt, style: sty, url: cvt === 'image' ? f('coverUrl').value.trim() : '' },
          btnTarget: target, btnLabel: target ? f('btnLabel').value.trim() : '', pinned: AUI.swOn(d.querySelector('[data-npin]')), state: pub === 'draft' ? 'draft' : 'published',
          publishAt: pub === 'at' ? isoLocal(f('publishAt').value) : pub === 'now' ? (n.state === 'published' && !sched ? n.publishAt : '') : n.publishAt || '', unpublishAt: isoLocal(f('unpublishAt').value) };
      };
      d.querySelector('[data-nsave]').addEventListener('click', async e => {
        const v = collect();
        if (!v.title || !v.body) { toast('請填寫標題與內文', 'err'); return; }
        if (cvt === 'image' && !/^https:\/\//.test(v.cover.url)) { toast('圖片網址需要 https:// 開頭', 'err'); return; }
        if (pub === 'at' && !v.publishAt) { toast('請選擇發布時間', 'err'); return; }
        const b = e.currentTarget; b.disabled = true;
        try { await api.call('adminSaveNews', { news: v }); toast(v.state === 'draft' ? '已存成草稿' : '已發布，網站已更新', 'ok'); AUI.closeDrawer(); this.rerender(); } catch (er) { errToast(er); b.disabled = false; }
      });
      const tb = d.querySelector('[data-ntest]'); if (tb) tb.addEventListener('click', async () => { tb.disabled = true; try { await api.call('adminSendNews', { newsId: n.newsId, test: true }); toast('已傳到你的 LINE（以目前儲存的內容）', 'ok'); } catch (er) { errToast(er); } tb.disabled = false; });
      const db = d.querySelector('[data-ndel]'); if (db) db.addEventListener('click', async () => { if (!await confirmBox('刪除消息', `<p>確定刪除「${U.esc(n.title)}」？網站上會立即移除；已經傳出的 LINE 不會收回。</p>`, '刪除', true)) return; AUI.closeDrawer(); this.run(() => api.call('adminDeleteNews', { newsId: n.newsId }), '已刪除'); });
    }, { cls: 'nw-dw', label: '編輯消息' });
  },
  async newsSend(n) {
    let aud = 'all', months = 6, mode = 'now', est = null;
    const body = () => `<p class="mnote">「${U.esc(n.title)}」會用卡片傳給好友，按鈕「看完整內容」回到網站。</p>
      <div class="nw-aud" role="radiogroup">${NEWS_AUD.map(a => `<button type="button" role="radio" aria-checked="${a[0] === aud}" class="nw-ao ${a[0] === aud ? 'on' : ''}" data-aud="${a[0]}"><span class="rd"></span><span><b>${a[1]}</b><small>${a[2]}</small></span></button>`).join('')}</div>
      ${aud === 'dormant' ? `<label class="fld"><span class="lbl"><span>超過幾個月沒有回來</span></span><select class="inp" data-mon>${[3, 6, 12].map(m => `<option value="${m}" ${m === months ? 'selected' : ''}>${m} 個月</option>`).join('')}</select></label>` : ''}
      <div class="fld"><span class="lbl"><span>什麼時候送</span></span><div class="seg sm" data-when><button type="button" class="${mode === 'now' ? 'on' : ''}" data-v="now">現在</button><button type="button" class="${mode === 'at' ? 'on' : ''}" data-v="at">排定時間</button></div>
        <input class="inp num" type="datetime-local" data-at ${mode === 'at' ? '' : 'hidden'}></div>
      <div class="nw-quota" data-est>${!est ? '<span class="muted">計算人數與額度中…</span>' : this.newsEstHTML(est)}</div>
      <p class="nw-warn">${ic('warn')}送出後無法收回，只能再發一則更正。</p>`;
    const load = async sc => { est = null; sc.querySelector('[data-est]').innerHTML = '<span class="muted">計算人數與額度中…</span>'; try { est = await api.call('adminNewsAudience', { audience: aud, filter: { months } }); } catch (e) { est = { error: e.message }; } sc.querySelector('[data-est]').innerHTML = this.newsEstHTML(est); const btn = sc.querySelector('[data-ok]'); if (btn) { btn.disabled = !!(est.error || est.enough === false || !est.count); btn.textContent = mode === 'at' ? '排定送出' : `確認送出${est.count ? ' ' + est.count + ' 則' : ''}`; } };
    const v = await modal({ title: '傳 LINE 給好友', ok: '確認送出', html: `<div data-nb>${body()}</div>`, cls: 'nw-dlg',
      onOpen: sc => {
        const re = () => { sc.querySelector('[data-nb]').innerHTML = body(); bind(); load(sc); };
        const bind = () => {
          sc.querySelectorAll('[data-aud]').forEach(b => b.addEventListener('click', () => { aud = b.dataset.aud; re(); }));
          const m = sc.querySelector('[data-mon]'); if (m) m.addEventListener('change', () => { months = +m.value; load(sc); });
          sc.querySelectorAll('[data-when] [data-v]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.v; sc.querySelectorAll('[data-when] [data-v]').forEach(x => x.classList.toggle('on', x === b)); sc.querySelector('[data-at]').hidden = mode !== 'at'; const ob = sc.querySelector('[data-ok]'); if (ob && est && est.count) ob.textContent = mode === 'at' ? '排定送出' : `確認送出 ${est.count} 則`; }));
        };
        bind(); load(sc);
      },
      onOk: sc => { const at = mode === 'at' ? isoLocal((sc.querySelector('[data-at]') || {}).value) : ''; if (mode === 'at' && !at) { toast('請選擇送出時間', 'err'); return false; } return { at }; } });
    if (!v) return;
    try {
      const r = await api.call('adminSendNews', Object.assign({ newsId: n.newsId, audience: aud, filter: { months } }, v.at ? { at: v.at } : {}));
      toast(r.scheduled ? '已排定，時間到會自動送出' : `已送出給 ${r.send.count} 人`, 'ok'); this.bust(); this.rerender();
    } catch (er) { errToast(er); }
  },
  newsEstHTML(e) {
    if (!e) return '';
    if (e.error) return `<span class="dn">${U.esc(e.error)}</span>`;
    const q = e.quota;
    const qline = !q ? '<small class="muted">暫時取不到 LINE 的訊息額度（LINE 通知未串接或展示模式）</small>' : !q.limited ? `<small class="muted">本月已用 ${q.used} 則・方案沒有上限</small>` : `<span>這次約用掉 <b class="num">${e.count}</b> 則・本月已用 <b class="num">${q.used}</b> 則・上限 <b class="num">${q.limit}</b> 則</span><span class="nw-meter"><i style="width:${Math.min(100, Math.round((q.used + e.count) / Math.max(1, q.limit) * 100))}%"></i></span>`;
    return `<b class="num nw-cnt">${e.count} 人</b><small class="muted">${U.esc(e.label)}・${U.esc(e.countNote || '')}</small>${qline}<small class="muted">預約、報告等通知也用同一份額度</small>${e.enough === false ? '<span class="dn">額度不夠，這次不能送出。可以改送「指定客人」或下個月再送。</span>' : !e.count ? '<span class="dn">沒有符合條件的對象</span>' : ''}`;
  }
});

/* ===================== v5.3 預約後台・設定 › 流程測試（網站 A：預約到服務完成；設計稿第 21 排） ===================== */
const TEST_A = {
  create: ['建立測試預約（待付訂金）', '手機收到「預約已建立」與付款資訊'],
  deposit: ['付訂金 → 確認訂金', '手機在「我的預約」回填末五碼 → 這裡按「確認訂金」→ 手機收到「訂金已確認」'],
  pre: ['快轉到服務前 3 天 20:00', '手機收到「行前提醒」（含 Zoom 連結；測試預約用測試連結）'],
  day: ['快轉到服務當天・開始前 2 小時', '手機收到「當日提醒」'],
  done: ['服務完成', '手機收到「陪伴期開始」；之後的陪伴、報告請到網站 B 陪伴後台的「流程測試」']
};
Object.assign(Admin, {
  async test(root) {
    const x = await api.call('adminTestState', { site: 'a' }), b = x.booking, P = x.prereq || {};
    const warn = P.customer ? '' : `<p class="note warn">${ic('warn')}<span>你的 LINE 帳號還沒有「客人」紀錄：請先用手機在網站 A 用 LINE 登入一次。</span></p>`;
    const intro = `<p class="note info">${ic('sparkle')}<span>這裡測<b>網站 A：從預約到服務完成</b>。會建立一筆<b>只給你自己的測試預約</b>，每按一次「快轉」只移動這一筆的日期，再用系統排程同樣的條件送出通知；真實客人與系統時間都不受影響。電腦按按鈕，手機用 LINE 當客人。服務完成之後的陪伴與報告，請到網站 B 陪伴後台的「流程測試」。</span></p>`;
    const planSel = `<label class="fld"><span class="lbl">方案</span><select class="inp" data-tplan>${(x.plans || []).map(p => `<option value="${U.esc(p.planId)}">${U.esc(p.name)}</option>`).join('')}</select></label>`;
    const od = x.overdue;
    const odRow = `<li class="tf-row br ${od ? 'done' : ''}"><span class="n num">＋</span><span class="t"><b>另一條路：訂金逾期未付</b>${od ? `<small>${od.status === 'CANCELLED' ? '已自動取消' : U.esc(od.status)}</small>` : ''}</span><span class="ex">另建一筆待付訂金 → 快轉到付款期限後 → 系統自動取消、釋出時段</span><span class="a">${od ? '<span class="chip ok sm">完成</span>' : ''}<button class="btn ghost sm" data-tover ${P.customer ? '' : 'disabled'}>${od ? '重跑' : '開始'}</button></span></li>`;
    const clearBtn = `<button class="btn ghost sm" data-tclear>${ic('x')}<span>清除測試資料</span></button>`;
    if (!b) {
      const html = this.shell({ title: '流程測試', pri: od ? clearBtn : '' }, `${intro}${warn}
        <section class="card tf-new"><div class="cb">
          <h3>建立測試預約</h3>
          <p class="muted">服務日先設在 5 天後，狀態是「待付訂金」，用你的 LINE 帳號，名單上標「測試」。同一時間只有一筆。</p>
          ${planSel}
          <button class="btn pri" data-tcreate ${P.customer ? '' : 'disabled'}>${ic('plus')}建立測試預約</button>
        </div></section>
        <ol class="tf-list">${odRow}</ol>`);
      return this.mount(root, html, r => this.testBind(r));
    }
    const st = x.steps || [], cur = st.findIndex(v => !v.done), now = cur < 0 ? 99 : cur;
    const act = (s, i) => {
      if (s.key === 'create') return '<span class="chip ok sm">完成</span>';
      const lbl = { deposit: '確認訂金', done: '標記完成' }[s.key] || '快轉';
      const lock = i > now || (s.key !== 'deposit' && !st[1].done) || (s.key === 'day' && !st[2].done);
      if (s.done && (s.key === 'deposit' || s.key === 'done' || st[4].done)) return '<span class="chip ok sm">完成</span>';
      return `${s.done ? '<span class="chip ok sm">完成</span>' : ''}<button class="btn ${!s.done && i === now ? 'pri' : 'ghost'} sm" data-tstep="${s.key}" ${lock || (st[4].done && !s.done) ? 'disabled' : ''}>${s.done ? '重跑這一站' : lbl}</button>`;
    };
    const rows = st.map((s, i) => `<li class="tf-row ${s.done ? 'done' : ''} ${i === now ? 'now' : ''}"><span class="n num">${i}</span><span class="t"><b>${TEST_A[s.key][0]}</b>${s.info ? `<small>${U.esc(s.info)}</small>` : ''}</span><span class="ex">${TEST_A[s.key][1]}</span><span class="a">${act(s, i)}</span></li>`).join('');
    const dd = x.daysToService, when = dd > 0 ? `（${dd} 天後）` : dd === 0 ? '（今天）' : `（${-dd} 天前）`;
    const html = this.shell({ title: '流程測試', pri: clearBtn }, `${intro}${warn}
      <section class="card tf-bk"><div class="cb"><span class="chip warn sm">測試</span><b>${U.esc(b.name)}</b><span>${U.esc(b.planName)}・服務日 <span class="num">${U.dot(b.date).slice(5)} ${U.esc(b.startTime || '')}</span>${when}</span><span class="muted tf-q">LINE 已送 <b class="num">${x.sent || 0}</b> 則</span></div></section>
      <ol class="tf-list">${rows}${odRow}</ol>
      <p class="muted tf-ft">快轉只移動這一筆測試預約的日期與時間；「另一條路」會另外建一筆，不影響上面這筆。</p>`);
    this.mount(root, html, r => this.testBind(r));
  },
  testBind(r) {
    const go = async (btn, data, ok) => { btn.disabled = true; try { const o = await api.call('adminTestRun', Object.assign({ site: 'a' }, data)); toast(o.msg || ok || '已完成', 'ok'); this.rerender(); } catch (er) { errToast(er); btn.disabled = false; } };
    const plan = () => (r.querySelector('[data-tplan]') || {}).value || '';
    r.querySelectorAll('[data-tcreate]').forEach(b => b.addEventListener('click', () => go(b, { op: 'create', planId: plan() }, '已建立測試預約')));
    r.querySelectorAll('[data-tover]').forEach(b => b.addEventListener('click', () => go(b, { op: 'overdue', planId: plan() })));
    r.querySelectorAll('[data-tstep]').forEach(b => b.addEventListener('click', () => go(b, { op: 'step', step: b.dataset.tstep })));
    r.querySelectorAll('[data-tclear]').forEach(cb => cb.addEventListener('click', async () => {
      if (!await confirmBox('清除測試資料', '<p>會刪除網站 A 的測試預約（包含「訂金逾期未付」那一筆）。<b>刪除後無法復原。</b></p><p class="muted">已送出的 LINE 訊息不會收回；網站 B 的測試資料不受影響。</p>', '確認清除', true)) return;
      try { await api.call('adminTestRun', { site: 'a', op: 'clear' }); toast('已清除測試資料', 'ok'); this.rerender(); } catch (er) { errToast(er); }
    }));
  }
});
